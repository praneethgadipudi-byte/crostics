/* ============================================================== storage */

function blankProfile() {
  return {
    streak: 0, best: 0, hints: START_HINTS, coins: START_COINS,
    done: {}, progress: {}, power: {}, glow: {}, burst: {}
  };
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return blankProfile();
    const p = Object.assign(blankProfile(), JSON.parse(raw));
    if (typeof p.coins !== "number") p.coins = START_COINS;
    if (!p.glow) p.glow = {};
    if (!p.burst) p.burst = {};
    return p;
  } catch (e) {
    return blankProfile();
  }
}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S.profile)); } catch (e) {}
}

/* ================================================================ state */

const S = {
  screen: "home",
  pack: 0,
  pi: 0,
  p: null,
  sel: null,
  ctx: "clue",
  overlay: null,
  busy: false,
  power: false,
  powerPick: false,
  glow: false,
  glowPick: false,
  reviewTab: "fact",
  streakInfo: null,
  profile: load()
};

const app = document.getElementById("app");

/* Five themes of ten sit behind the tabs on home, all of them generated by the
   builder. A theme that ships with no puzzles renders as a preview grid. */
const PACKS = PACK_DATA;

/* rebound whenever the tab changes, so the rest of the game reads one list */
let puzzles = PACKS[0].puzzles;

function packInfo() {
  return PACKS[S.pack].pack;
}

function setPack(i) {
  S.pack = i;
  puzzles = PACKS[i].puzzles;
}

/* ids restart at 1 in every theme, so anything saved has to name the theme too */
function keyOf(data) {
  return packInfo().id + ":" + data.id;
}

/* ======================================================== puzzle runtime */

function quoteLetters(quote) {
  const out = [], up = quote.toUpperCase();
  for (let i = 0; i < up.length; i++) {
    if (up[i] >= "A" && up[i] <= "Z") out.push(up[i]);
  }
  return out;
}

/*
 * A number identifies a letter rather than a position, so every E in the puzzle
 * carries the same index and they are all solved together. A few letters are
 * left unnumbered as a difficulty lever: they still fill as a group, the player
 * just cannot see where they go until the first one is found.
 */
const MAX_HIDDEN = 3;
function letterIndex(letters, data) {
  const count = {}, order = [];
  letters.forEach(ch => {
    if (count[ch]) count[ch]++;
    else { count[ch] = 1; order.push(ch); }
  });

  /* The builder decides which letters lose their number, because how many and
     which ones are two of the difficulty levers: hiding a letter the quote uses
     eight times removes far more of the map than hiding one used once. Older
     data without a list falls back to hiding the rarest. */
  const hidden = data.hide && data.hide.length
    ? data.hide.filter(ch => count[ch])
    : order.slice()
        .sort((a, b) => count[a] - count[b] || order.indexOf(a) - order.indexOf(b))
        .slice(0, Math.min(MAX_HIDDEN, data.free.length));

  /* numbering follows the quote, and skips the hidden letters so the visible
     run stays contiguous */
  const num = {};
  let n = 0;
  order.forEach(ch => { if (hidden.indexOf(ch) < 0) num[ch] = ++n; });
  return { num: num, hidden: hidden };
}

/*
 * Every letter the player can type is a slot. A slot is reachable from the clue
 * list, from the quote, or from both, which is what makes an answer letter and
 * its quote cell the same thing rather than two values kept in sync.
 */
function buildPuzzle(data) {
  const slots = [];
  const cellSlot = [];
  const letters = quoteLetters(data.quote);

  const clues = data.clues.map((c, ci) => {
    const ids = [];
    for (let j = 0; j < c.a.length; j++) {
      const id = slots.length;
      slots.push({
        id: id, correct: c.a[j], value: "", locked: false,
        clue: ci, pos: j, cell: c.m[j]
      });
      ids.push(id);
    }
    return {
      label: String.fromCharCode(65 + ci),
      text: c.c, answer: c.a, slots: ids, solved: false
    };
  });

  /* every quote cell is a slot of its own, so an answer letter and the quote
     cell it feeds are two places to fill, joined only by their shared letter.
     Filling both at once is what the auto-fill powerup buys. */
  letters.forEach((ch, k) => {
    const id = slots.length;
    slots.push({
      id: id, correct: ch, value: "", locked: false,
      clue: -1, pos: -1, cell: k
    });
    cellSlot[k] = id;
  });

  const ix = letterIndex(letters, data);

  return {
    data: data, slots: slots, cellSlot: cellSlot, clues: clues,
    letters: letters, num: ix.num, hidden: ix.hidden,
    strikes: STRIKES, revived: false, retried: false, quoteHailed: false
  };
}

/*
 * The intro sits between picking a puzzle and playing it. The board is built
 * up front because it shows through behind the overlay. A powerup already paid
 * for on this puzzle comes back switched on and is not charged again.
 */
function bandLabel(band) {
  if (band === "hard") return { cls: "vhard", text: "very hard" };
  if (band === "medium") return { cls: "hard", text: "hard" };
  return { cls: "easy", text: "easy" };
}

function enterPuzzle(index) {
  S.pi = index;
  S.p = buildPuzzle(puzzles[index]);
  const id = keyOf(puzzles[index]);
  S.power = !!S.profile.power[id];
  S.powerPick = S.power;
  S.glow = !!S.profile.glow[id];
  S.glowPick = S.glow;
  restoreProgress();
  S.sel = firstOpenSlot();
  S.ctx = "clue";
  S.overlay = null;
  S.screen = "intro";
  render();
}

function startPuzzle() {
  const id = keyOf(puzzles[S.pi]);
  if (S.glowPick && !S.profile.glow[id]) {
    if (S.profile.coins < GLOW_COST) {
      S.glowPick = false;
      toast("Not enough coins");
      render();
      return;
    }
    S.profile.coins -= GLOW_COST;
    S.profile.glow[id] = true;
    save();
  }
  if (!S.glowPick && S.profile.glow[id]) {
    delete S.profile.glow[id];
    save();
  }
  if (S.powerPick && !S.profile.power[id]) {
    return playAd("w2e", () => {
      S.profile.power[id] = true;
      save();
      openPuzzle(S.pi);
    });
  }
  /* switching it off again gives up the ability, so a later run pays for it */
  if (!S.powerPick && S.profile.power[id]) {
    delete S.profile.power[id];
    save();
  }
  openPuzzle(S.pi);
}

function openPuzzle(index) {
  S.pi = index;
  S.p = buildPuzzle(puzzles[index]);
  const id = keyOf(puzzles[index]);
  S.power = !!S.profile.power[id];
  S.glow = !!S.profile.glow[id];
  restoreProgress();
  /* a board saved before this rule still settles quote cells for solved words */
  settleQuoteFromWords(
    S.p.clues
      .map((c, i) => i)
      .filter(i => S.p.clues[i].slots.every(id => S.p.slots[id].locked))
  );
  /* likewise a board saved before the quote finished the puzzle for you */
  const quoteAlreadyDone = quoteComplete();
  S.sel = firstOpenSlot();
  S.ctx = "clue";
  S.busy = false;
  S.screen = "puzzle";
  /* closing the tab on the fail popup must not hand back three fresh strikes */
  S.overlay = S.p.strikes <= 0 ? "fail" : null;
  render();
  if (S.overlay) return;
  if (quoteAlreadyDone) {
    S.busy = true;
    const board = S.p;
    return void setTimeout(() => winIfStillPlaying(board),
      settleWordsFromQuote(QUOTE_LEAD) + 700);
  }
  /* the board has to exist before the burst can animate across it */
  fireIntroBurst();
}

function firstOpenSlot() {
  const p = S.p;
  for (let c = 0; c < p.clues.length; c++) {
    for (const id of p.clues[c].slots) {
      if (!p.slots[id].locked) return id;
    }
  }
  for (const s of p.slots) if (!s.locked) return s.id;
  return 0;
}

function restoreProgress() {
  const rec = S.profile.progress[keyOf(S.p.data)];
  if (!rec) return;
  const v = rec.v || "", l = rec.l || "";
  /* a board saved under an older cell layout cannot be mapped back safely */
  if (v.length !== S.p.slots.length) return void clearProgress(keyOf(S.p.data));
  S.p.slots.forEach((s, i) => {
    const ch = v[i] || " ";
    s.value = ch === " " ? "" : ch;
    s.locked = l[i] === "1";
  });
  S.p.strikes = typeof rec.s === "number" ? rec.s : STRIKES;
  refreshSolved();
  /* a resumed board must not applaud a quote the player finished last session */
  S.p.quoteHailed = quoteComplete();
}

function saveProgress() {
  const p = S.p;
  if (!p) return;
  let v = "", l = "";
  p.slots.forEach(s => { v += s.value || " "; l += s.locked ? "1" : "0"; });
  S.profile.progress[keyOf(p.data)] = { v: v, l: l, s: p.strikes };
  save();
}

function clearProgress(key) {
  delete S.profile.progress[key];
  save();
}

function refreshSolved() {
  S.p.clues.forEach(c => {
    c.solved = c.slots.every(id => S.p.slots[id].locked);
  });
}

function isWon() {
  return S.p.slots.every(s => s.value === s.correct);
}

/* ================================================================= input */

function slotOf(id) { return S.p.slots[id]; }

function selectSlot(id, ctx) {
  if (id == null) return;
  S.sel = id;
  /* a slot reached from the quote keeps walking along the quote, and one
     reached from a clue keeps walking along that answer. A cell no clue feeds
     can only ever be worked from the quote. */
  if (ctx) S.ctx = ctx;
  if (S.p.slots[id].clue < 0) S.ctx = "quote";
  syncCells();
  scrollClueIntoView();
}

function firstOpenQuoteSlot() {
  const p = S.p;
  for (let c = 0; c < p.cellSlot.length; c++) {
    const id = p.cellSlot[c];
    if (id != null && !p.slots[id].locked) return id;
  }
  return null;
}

function firstOpenClueSlot() {
  const p = S.p;
  for (const row of p.clues) {
    for (const id of row.slots) if (!p.slots[id].locked) return id;
  }
  return null;
}

/*
 * Typing walks along whichever grid the cursor is working in. When that grid
 * runs out the cursor crosses to the other one rather than stalling, so
 * finishing every answer drops you into the quote, and finishing the quote
 * brings you back to the answers.
 */
function advance() {
  const p = S.p, cur = slotOf(S.sel);
  if (!cur) return;

  if (cur.clue >= 0 && S.ctx === "clue") {
    const row = p.clues[cur.clue];
    for (let j = cur.pos + 1; j < row.slots.length; j++) {
      if (!p.slots[row.slots[j]].locked) return selectSlot(row.slots[j]);
    }
    for (let c = 1; c <= p.clues.length; c++) {
      const next = p.clues[(cur.clue + c) % p.clues.length];
      for (const id of next.slots) if (!p.slots[id].locked) return selectSlot(id);
    }
    const intoQuote = firstOpenQuoteSlot();
    if (intoQuote != null) selectSlot(intoQuote, "quote");
    return;
  }

  /* a quote-only cell simply walks to the next open cell along the quote */
  for (let c = cur.cell + 1; c < p.cellSlot.length; c++) {
    const id = p.cellSlot[c];
    if (id != null && !p.slots[id].locked) return selectSlot(id);
  }
  const wrapped = firstOpenQuoteSlot();
  if (wrapped != null) return selectSlot(wrapped, "quote");
  const intoClues = firstOpenClueSlot();
  if (intoClues != null) selectSlot(intoClues, "clue");
}

function retreat() {
  const p = S.p, cur = slotOf(S.sel);
  if (!cur) return;
  if (cur.clue >= 0 && S.ctx === "clue") {
    const row = p.clues[cur.clue];
    for (let j = cur.pos - 1; j >= 0; j--) {
      if (!p.slots[row.slots[j]].locked) return selectSlot(row.slots[j]);
    }
    return;
  }
  for (let c = cur.cell - 1; c >= 0; c--) {
    const id = p.cellSlot[c];
    if (id != null && !p.slots[id].locked) return selectSlot(id);
  }
}

function typeLetter(ch) {
  const p = S.p;
  if (!p || S.overlay || S.busy) return;
  const s = slotOf(S.sel);
  if (!s || s.locked) return;

  s.value = ch;

  if (ch === s.correct) {
    const quoteWasDone = S.p.quoteHailed;
    fillLetter(s);
    const fresh = lockCompletedWords();
    settleQuoteFromWords(fresh);
    if (afterFill(fresh, quoteWasDone)) return;
    advance();
  } else {
    missLetter(s);
  }
}

function missLetter(s) {
  const p = S.p;
  S.busy = true;
  bump(s, "shake");
  syncCells();
  setTimeout(() => {
    bumps[s.id] = "broke";
    p.strikes = Math.max(0, p.strikes - 1);
    saveProgress();
    syncCells();
    flashLife();
    setTimeout(() => {
      s.value = "";
      delete bumps[s.id];
      saveProgress();
      syncCells();
      S.busy = false;
      if (p.strikes === 0) return showFail();
    }, 780);
  }, 520);
}

function backspace() {
  const s = slotOf(S.sel);
  if (!s) return;
  if (!s.locked && s.value) {
    s.value = "";
    saveProgress();
    syncCells();
    return;
  }
  retreat();
  const prev = slotOf(S.sel);
  if (prev && !prev.locked && prev.value) {
    prev.value = "";
    saveProgress();
  }
  syncCells();
}

/*
 * A correct letter settles only the cell it was typed into. Everything else
 * spreads through the two settle rules: a solved answer reveals its quote
 * cells, and a solved quote reveals the answers.
 */
function fillLetter(slot) {
  slot.value = slot.correct;
  slot.locked = true;
  bump(slot, "pop");
  syncCells();
}

/*
 * Base rule, independent of the powerup: whenever a clue-word is fully solved,
 * every numbered letter in that word reveals its quote cells. Unindexed (?)
 * letters are left out entirely and stay manual.
 */
function settleQuoteFromWords(rows) {
  if (!rows || !rows.length) return;
  const p = S.p;
  const letters = {};
  rows.forEach(i => {
    p.clues[i].slots.forEach(id => {
      const ch = p.slots[id].correct;
      if (p.num[ch]) letters[ch] = true;
    });
  });

  let k = 0;
  Object.keys(letters).forEach(ch => {
    p.slots.forEach(s => {
      if (s.clue < 0 && s.correct === ch && !s.locked) {
        s.value = ch;
        s.locked = true;
        const wait = Math.min(k++ * 25, 200);
        setTimeout(() => { bump(s, "pop"); syncCells(); }, wait);
      }
    });
  });
}

/*
 * The mirror of settleQuoteFromWords: once the quote is whole it has already
 * told you every answer, so the remaining answer cells fall into place rather
 * than asking the player to type out a foregone conclusion.
 *
 * This is the payoff of the whole puzzle, so it plays as a cascade down the
 * clue list instead of dropping the board at once: each word takes its letters
 * in turn, scrolls itself into view and flashes the solved sweep, then the next
 * word starts. How much is left varies enormously -- a player who worked the
 * quote directly can leave every answer empty -- so the pace is fitted to the
 * work remaining rather than fixed per letter, keeping the run inside
 * CASCADE_MS either way. Returns the moment it finishes, so the caller knows
 * when the win screen may follow.
 */
const CASCADE_MS = 2400;
const CASCADE_MAX_STEP = 45;
/* how long the quote keeps the stage to itself before the answers start */
const QUOTE_LEAD = 600;

function settleWordsFromQuote(startAt) {
  const p = S.p;
  const runs = [];
  let cells = 0;
  p.clues.forEach((row, i) => {
    const open = row.slots.filter(id => !p.slots[id].locked);
    if (!open.length) return;
    runs.push({ i: i, row: row, open: open });
    cells += open.length;
  });
  if (!runs.length) return startAt;

  /* the row gap is worth two letters, so budget for both together */
  const step = Math.min(CASCADE_MAX_STEP, CASCADE_MS / (cells + runs.length * 2));
  let t = startAt;

  /* a few seconds is long enough for the player to walk out, so every step
     checks it is still animating the board it was started for */
  runs.forEach((r, k) => {
    r.open.forEach((id, j) => setTimeout(() => {
      if (S.p !== p) return;
      const s = p.slots[id];
      s.value = s.correct;
      s.locked = true;
      bump(s, "pop");
      syncCells();
    }, t + j * step));

    const span = r.open.length * step;
    setTimeout(() => {
      if (S.p !== p) return;
      r.row.solved = true;
      syncCells();
      flashRow(r.i);
      scrollRowIntoView(r.i);
      buzz(720 + k * 26, 50);
    }, t + span);

    t += span + step * 2;
  });

  vibrate([18, 60, 18]);
  return t;
}

/* returns the rows that came out on this keystroke, so the caller can applaud */
function lockCompletedWords() {
  const fresh = [];
  S.p.clues.forEach((row, i) => {
    const done = row.slots.every(id => S.p.slots[id].value === S.p.slots[id].correct);
    if (done) row.slots.forEach(id => { S.p.slots[id].locked = true; });
    if (done && !row.solved) fresh.push(i);
    row.solved = done;
  });
  return fresh;
}

function quoteComplete() {
  return S.p.slots.every(s => s.clue >= 0 || s.value === s.correct);
}

/*
 * Two sizes of applause: a row sweep for a word, and the quote card reacting
 * with a ripple and a light burst. The quote cheer is the last beat before the
 * win screen, so it has to feel smaller than the full screen one that follows.
 */
function flashRow(i) {
  const node = document.getElementById("row" + i);
  if (!node) return;
  node.classList.add("justSolved");
  setTimeout(() => node.classList.remove("justSolved"), 720);
}

function celebrateRows(rows) {
  if (!rows.length) return;
  rows.forEach((i, k) => setTimeout(() => flashRow(i), k * 90));
  buzz(880, 70);
  vibrate(25);
}

/*
 * Shared tail for every move that fills cells. Completing the quote completes
 * the puzzle, so the quote cheer plays while the remaining answer cells settle
 * behind it, and only then does the win screen arrive. Returns true when the
 * puzzle is over, so the caller knows not to move the cursor on.
 */
function afterFill(fresh, quoteWasDone) {
  const quoteJustDone = !quoteWasDone && quoteComplete();
  if (quoteJustDone) {
    S.p.quoteHailed = true;
    /* the board finishes itself from here, so typing is closed off */
    S.busy = true;
  }
  saveProgress();
  syncCells();

  if (quoteJustDone) {
    celebrateRows(fresh);
    cheerQuote();
    /* the answers start filling while the quote is still rippling, so the
       cascade reads as the quote handing the words over */
    const board = S.p;
    setTimeout(() => winIfStillPlaying(board), settleWordsFromQuote(QUOTE_LEAD) + 700);
    return true;
  }
  if (isWon()) {
    const board = S.p;
    setTimeout(() => winIfStillPlaying(board), 260);
    return true;
  }
  celebrateRows(fresh);
  return false;
}

function cheerQuote() {
  const card = app.querySelector(".quoteCard");
  if (card) {
    card.classList.add("done");
    setTimeout(() => card.classList.remove("done"), 1400);
  }

  /* the ripple runs through the bump map so a redraw cannot cut it short */
  S.p.slots.filter(s => s.clue < 0).forEach((s, i) => {
    setTimeout(() => { bump(s, "pop"); syncCells(); }, i * 26);
  });

  const note = document.createElement("div");
  note.className = "midCheer";
  note.innerHTML = `<b>QUOTE COMPLETE</b><span>The whole line is yours</span>`;
  app.appendChild(note);
  setTimeout(() => note.remove(), 1500);

  const cv = document.createElement("canvas");
  cv.className = "fx";
  cv.width = app.clientWidth;
  cv.height = app.clientHeight;
  app.appendChild(cv);
  runConfetti(cv, 40, .3, 78);
  setTimeout(() => cv.remove(), 1500);

  buzz(1180, 120);
  vibrate([20, 40, 20]);
}

function hintLabel() {
  return UNLIMITED_HINTS ? "\u221E" : String(S.profile.hints);
}

function useHint() {
  const p = S.p;
  if (!p || S.overlay || S.busy) return;
  if (!UNLIMITED_HINTS && S.profile.hints <= 0) return toast("No hints left");
  const s = slotOf(S.sel);
  if (!s || s.locked) return toast("Pick an empty cell first");

  if (!UNLIMITED_HINTS) S.profile.hints--;
  const quoteWasDone = S.p.quoteHailed;
  fillLetter(s);
  const fresh = lockCompletedWords();
  settleQuoteFromWords(fresh);
  save();
  if (afterFill(fresh, quoteWasDone)) return;
  advance();
}

/*
 * The letter burst is bought once on the intro screen and spends itself the
 * moment the board opens: three random quote cells light up in turn. It fires
 * at most once per attempt, so reopening a part-played board does not keep
 * handing out letters.
 */
const BURST_LETTERS = 3;

function fireIntroBurst() {
  const p = S.p;
  if (!p || !S.power) return;
  const id = keyOf(p.data);
  if (S.profile.burst[id]) return;

  const pool = p.slots.filter(s => s.clue < 0 && !s.locked);
  if (!pool.length) return;
  const picks = [];
  while (picks.length < BURST_LETTERS && pool.length) {
    picks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }

  S.profile.burst[id] = true;
  const quoteWasDone = p.quoteHailed;

  /* revealed one at a time so the gift is watched rather than just found */
  picks.forEach((s, i) => setTimeout(() => {
    s.value = s.correct;
    s.locked = true;
    bump(s, "pop");
    syncCells();
    if (i < picks.length - 1) return;
    const fresh = lockCompletedWords();
    settleQuoteFromWords(fresh);
    save();
    afterFill(fresh, quoteWasDone);
  }, 280 + i * 170));
}

const bumps = {};
function bump(slot, cls) {
  bumps[slot.id] = cls;
  setTimeout(() => { delete bumps[slot.id]; syncCells(); }, 380);
}

let actx = null;
function buzz(freq, ms) {
  if (!SOUND) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = actx.createOscillator(), gain = actx.createGain();
    osc.type = "square";
    osc.frequency.value = freq;
    gain.gain.value = .07;
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + ms / 1000);
    osc.stop(actx.currentTime + ms / 1000 + .02);
  } catch (e) {}
}

function vibrate(pattern) {
  if (!HAPTICS || !navigator.vibrate) return;
  try { navigator.vibrate(pattern); } catch (e) {}
}

/*
 * A shake on one small cell was too quiet to register as a cost, so a strike now
 * lands on the whole screen at once.
 */
function flashLife() {
  const nodes = app.querySelectorAll(".life");
  const idx = STRIKES - S.p.strikes - 1;
  const box = nodes[idx];
  if (box) {
    box.classList.add("pop");
    setTimeout(() => box.classList.remove("pop"), 460);
  }
  buzz(150, 220);
  vibrate(S.p.strikes ? 70 : [50, 60, 110]);
}

/* ============================================================ flow: fail */

function showFail() {
  S.overlay = "fail";
  paintOverlay();
}

function doRevive() {
  playAd("w2e", () => {
    S.p.strikes = 1;
    S.p.revived = true;
    S.overlay = null;
    saveProgress();
    render();
  });
}

function doRetry() {
  /* coins are not deducted yet, the cost is shown for the flow only */
  S.p = buildPuzzle(puzzles[S.pi]);
  S.p.retried = true;
  S.sel = firstOpenSlot();
  S.overlay = null;
  /* a fresh board earns the burst it was already paid for */
  delete S.profile.burst[keyOf(S.p.data)];
  clearProgress(keyOf(S.p.data));
  render();
  fireIntroBurst();
}

function abandon() {
  S.profile.streak = 0;
  delete S.profile.power[keyOf(S.p.data)];
  delete S.profile.glow[keyOf(S.p.data)];
  delete S.profile.burst[keyOf(S.p.data)];
  clearProgress(keyOf(S.p.data));
  save();
  S.overlay = null;
  goHome();
}

/* ============================================================= flow: win */

/* the cascade takes seconds, and leaving the board in the middle of it must not
   land the player on a win screen for a puzzle they walked away from */
function winIfStillPlaying(p) {
  if (S.p === p && S.screen === "puzzle") win();
}

function win() {
  const p = S.p;
  S.profile.done[keyOf(p.data)] = true;
  S.profile.streak++;
  S.profile.best = Math.max(S.profile.best, S.profile.streak);

  delete S.profile.power[keyOf(p.data)];
  delete S.profile.glow[keyOf(p.data)];
  delete S.profile.burst[keyOf(p.data)];
  const reward = S.profile.streak % HINT_EVERY === 0;
  if (reward) S.profile.hints++;
  S.streakInfo = { streak: S.profile.streak, reward: reward };

  clearProgress(keyOf(p.data));
  save();

  cheer();
  setTimeout(() => {
    playAd("interstitial", () => {
      S.screen = "streak";
      render();
      setTimeout(() => {
        const bar = app.querySelector(".progBar i");
        if (bar) bar.style.width = barWidth() + "%";
      }, 120);
      const jump = setTimeout(gotoReview, 15000);
      app.onclick = () => { clearTimeout(jump); app.onclick = null; gotoReview(); };
    });
  }, 1900);
}

function barWidth() {
  const inCycle = S.streakInfo.streak % HINT_EVERY;
  return (inCycle === 0 ? HINT_EVERY : inCycle) / HINT_EVERY * 100;
}

function gotoReview() {
  app.onclick = null;
  S.screen = "review";
  S.reviewTab = "fact";
  render();
}

function goHome() {
  S.screen = "home";
  S.p = null;
  S.sel = null;
  render();
}

/* ============================================================== overlays */

function playAd(kind, done) {
  S.overlay = kind;
  paintOverlay();
  setTimeout(() => {
    S.overlay = null;
    paintOverlay();
    done();
  }, 2000);
}

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  app.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

function cheer() {
  const box = document.createElement("div");
  box.className = "cheer";
  box.innerHTML = `<div class="big">Solved!</div><div class="sub">Nicely worked out</div>`;
  app.appendChild(box);

  const cv = document.createElement("canvas");
  cv.id = "confetti";
  cv.width = app.clientWidth;
  cv.height = app.clientHeight;
  app.appendChild(cv);
  /* the loudest of the three: denser and longer than the quote burst */
  runConfetti(cv, 200, .42, 150);

  buzz(1320, 240);
  vibrate([30, 50, 30, 50, 80]);

  setTimeout(() => { box.remove(); cv.remove(); }, 1900);
}

function runConfetti(cv, count, originY, frames) {
  const ctx = cv.getContext("2d");
  const colors = ["#FF8A3D", "#FFB020", "#31BFA3", "#3FBE80", "#FF5F5F", "#FFD9AE"];
  const bits = [];
  for (let i = 0; i < count; i++) {
    bits.push({
      x: cv.width / 2 + (Math.random() - .5) * 120,
      y: cv.height * originY + (Math.random() - .5) * 60,
      vx: (Math.random() - .5) * 9,
      vy: -6 - Math.random() * 9,
      w: 5 + Math.random() * 6,
      h: 8 + Math.random() * 8,
      rot: Math.random() * 6.3,
      spin: (Math.random() - .5) * .35,
      c: colors[(Math.random() * colors.length) | 0]
    });
  }
  let n = 0;
  (function step() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => {
      b.vy += .38; b.x += b.vx; b.y += b.vy; b.rot += b.spin; b.vx *= .995;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.fillStyle = b.c;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();
    });
    if (++n < frames && cv.isConnected) requestAnimationFrame(step);
  })();
}

/* ================================================================ render */

function render() {
  app.querySelectorAll(".screen,.introVeil").forEach(n => n.remove());
  const el = document.createElement("div");
  el.className = "screen";
  const onBoard = S.screen === "puzzle" || S.screen === "intro";
  if (S.screen === "home") el.innerHTML = homeHtml();
  /* the intro is an overlay, so the board it is about to open renders beneath */
  else if (onBoard) el.innerHTML = puzzleHtml();
  else if (S.screen === "streak") el.innerHTML = streakHtml();
  else if (S.screen === "review") el.innerHTML = reviewHtml();
  app.insertBefore(el, app.firstChild);

  if (onBoard) { fitQuote(); syncCells(); wireRail(".clueScroll", ".clueWrap"); }
  if (S.screen === "review") wireRail(".scrollinner", ".reviewBody");
  if (S.screen === "home") wireRail(".scrollinner", ".scrollbox");

  if (S.screen === "intro") {
    const v = document.createElement("div");
    v.className = "introVeil";
    v.innerHTML = introHtml();
    app.appendChild(v);
  }
  paintOverlay();
}

function paintOverlay() {
  app.querySelectorAll(".veil,.adFull").forEach(n => n.remove());
  if (!S.overlay) return;

  /* closing the strike popup throws the streak away, so it asks first */
  if (S.overlay === "confirm") {
    const v = document.createElement("div");
    v.className = "veil";
    v.innerHTML = `
      <div class="sheet">
        <h2>Are you sure?</h2>
        <p>Walk away now and this run is over. Your streak goes back to zero
           and you start building it again from scratch.</p>
        <div class="streakBox">
          <div class="n">${S.profile.streak}</div>
          <div class="l">STREAK YOU WILL LOSE</div>
        </div>
        <button class="btn primary" data-act="quitNo">
          <span>&#128518; Nah, Just Kidding!</span>
        </button>
        <button class="btn ghost" data-act="quitYes">
          <span>&#128546; Yes, let it go</span>
        </button>
      </div>`;
    app.appendChild(v);
    return;
  }

  if (S.overlay === "fail") {
    const v = document.createElement("div");
    v.className = "veil";
    v.innerHTML = `
      <div class="sheet">
        <button class="closeX" data-act="askQuit">&#10005;</button>
        <h2>Out of strikes</h2>
        <p>Keep this run alive, or start the puzzle over.</p>
        <div class="streakBox">
          <div class="n">${S.profile.streak}</div>
          <div class="l">CURRENT STREAK</div>
        </div>
        <button class="btn primary" data-act="revive">
          <span>&#9654; Revive</span><span class="costTag">Watch an ad</span>
        </button>
        <button class="btn ghost" data-act="retry">
          <span>Retry</span><span class="costTag" style="background:#FFF1D9;color:#C88914">
          &#9679; ${RETRY_COST}</span>
        </button>
      </div>`;
    app.appendChild(v);
    return;
  }

  const isW2e = S.overlay === "w2e";
  const ad = document.createElement("div");
  ad.className = "adFull";
  ad.innerHTML = `
    <div class="tag">ADVERTISEMENT</div>
    <div class="big">${isW2e ? "W2E Ad" : "Interstitial Ad"}</div>
    <div class="adBar"><i></i></div>`;
  app.appendChild(ad);
}

/* ------------------------------------------------------------ puzzle */

function puzzleHtml() {
  const p = S.p, d = p.data;

  const spent = STRIKES - p.strikes;
  const lives = [0, 1, 2].map(i =>
    `<div class="life ${i < spent ? "spent" : ""}">${HEART_FULL}${HEART_EMPTY}</div>`).join("");
  const band = bandLabel(d.band);

  /* the quote wraps a word at a time so no answer is ever split across rows */
  let ci = 0, groups = [], cur = "";
  const up = d.quote.toUpperCase();
  for (let i = 0; i < up.length; i++) {
    const ch = up[i];
    if (ch >= "A" && ch <= "Z") {
      const slot = p.slots[p.cellSlot[ci]];
      const n = p.num[slot.correct];
      /* an unnumbered letter still fills as a group, it just cannot be mapped */
      cur += `<div class="cell ${n ? "" : "free"}" id="q${ci}" data-cell="${ci}">
                <span class="ix">${n || "?"}</span><b></b></div>`;
      ci++;
    } else if (ch === " ") {
      if (cur) groups.push(`<div class="qword">${cur}</div>`);
      cur = "";
    } else {
      if (cur) groups.push(`<div class="qword">${cur}</div>`);
      cur = "";
      groups.push(`<span class="qpunc">${ch}</span>`);
    }
  }
  if (cur) groups.push(`<div class="qword">${cur}</div>`);

  /*
   * Side by side reads tighter, but a clue that wraps squeezes the answer cells
   * into a column, so anything long switches the whole list to stacked.
   */
  const longest = Math.max.apply(null, d.clues.map(c => c.c.length));
  const widest = Math.max.apply(null, d.clues.map(c => c.a.length));
  const stack = longest > 30 || widest > 6;

  const rows = p.clues.map((row, i) => {
    const cells = row.slots.map(id => {
      const s = p.slots[id];
      /* the same number as every other cell holding this letter, which is what
         tells the player the two places are the same answer */
      const n = p.num[s.correct];
      return `<div class="cell ${n ? "" : "free"}" id="a${id}" data-slot="${id}">
                <span class="ix">${n || "?"}</span><b></b></div>`;
    }).join("");
    return `
      <div class="clueRow ${stack ? "stack" : ""}" id="row${i}">
        <div class="clueHead">
          <div class="lbl">${row.label}</div>
          <div class="txt">${row.text}</div>
        </div>
        <div class="ansCells">${cells}</div>
      </div>`;
  }).join("");

  const keys = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
  const kb = keys.map((r, i) => {
    let row = r.split("").map(k => `<button class="key" data-key="${k}">${k}</button>`).join("");
    if (i === 2) {
      row = `<button class="key" data-key="LEFT">&#9664;</button>` + row +
        `<button class="key" data-key="RIGHT">&#9654;</button>` +
        `<button class="key wide" data-key="DEL">&#9003;</button>`;
    }
    return `<div class="krow">${row}</div>`;
  }).join("");

  return `
    <div class="topbar">
      <button class="iconbtn" data-act="home">&#8592;</button>
      <div class="titles">
        <div class="t1">${d.title}</div>
        <div class="t2">${packInfo().name.toUpperCase()} &middot; PUZZLE ${d.id} &middot; ${band.text.toUpperCase()}</div>
      </div>
      <div class="lives">${lives}</div>
    </div>

    <div class="quoteHead">
      <div class="qhTitle">Quote</div>
      <div class="qhSub">Solve the quote to complete the puzzle</div>
    </div>

    <div class="quoteCard"><div class="quoteGrid">${groups.join("")}</div></div>

    <div class="clueWrap">
      <div class="clueScroll">${rows}</div>
      <div class="rail"><div class="thumb"></div></div>
      <div class="hintStack">
        <button class="hintBtn ${S.profile.hints ? "" : "empty"}" data-act="hint" aria-label="Hint">&#128161;</button>
      </div>
    </div>

    <div class="kb">${kb}</div>
    <div class="banner">BANNER AD</div>`;
}

/*
 * Cell size is measured rather than guessed, because the row count depends on
 * where words happen to break, not just on how many letters there are. Four
 * rows is the target for every quote, short ones simply use fewer.
 */
const ROW_GAP = 6;
const MIN_CW = 20;
const COMFY_CW = 24;
function fitQuote() {
  const grid = app.querySelector(".quoteGrid");
  if (!grid) return;
  const target = 4;
  const sizes = [28, 26, 24, 22, 21, 20];

  /* measure every candidate once, then decide */
  const rowsAt = {};
  for (const size of sizes) {
    apply(size);
    rowsAt[size] = Math.round((grid.offsetHeight + ROW_GAP) / (size * 1.34 + ROW_GAP));
  }

  /*
   * Legible index numbers matter more than a tight row count, so a quote is
   * allowed one row beyond its target rather than shrink under COMFY_CW, and
   * MIN_CW is the hard floor whatever the row count comes to.
   */
  const exact = sizes.find(s => rowsAt[s] <= target);
  const loose = sizes.find(s => rowsAt[s] <= target + 1);
  apply(exact >= COMFY_CW ? exact : (loose || exact || MIN_CW));

  function apply(size) {
    grid.style.setProperty("--cw", size + "px");
    grid.style.setProperty("--cf", Math.round(size * 0.58) + "px");
    grid.style.setProperty("--ixf", Math.max(6, Math.min(9, Math.round(size * 0.32))) + "px");
  }
}

/*
 * Cells are patched in place rather than re-rendered so the pop and shake
 * animations survive, the clue list keeps its scroll position, and typing on a
 * long puzzle stays cheap.
 */
function syncCells() {
  const p = S.p;
  if (!p) return;
  const sel = p.slots[S.sel];
  const selClue = sel ? sel.clue : -2;

  /* one slot, one cell: a clue letter draws in the list, a quote letter in the
     quote. Marking every other cell that holds the selected letter is what the
     key guide buys, so ordinary play leaves the board plain and the player has
     to carry the index in their head. An unnumbered letter never marks peers:
     with no index on show, revealing where it goes would hand back the
     difficulty that hiding it bought. */
  const spread = !!(sel && S.glow && p.num[sel.correct]);
  p.slots.forEach(s => {
    const node = s.clue >= 0
      ? document.getElementById("a" + s.id)
      : document.getElementById("q" + s.cell);
    if (!node) return;

    const cls = ["cell"];
    if (!p.num[s.correct]) cls.push("free");
    if (s.locked) cls.push("lock");
    else if (s.value && s.value !== s.correct) cls.push("wrong");
    if (bumps[s.id]) cls.push(bumps[s.id]);
    if (sel) {
      if (s.id === sel.id) cls.push("sel");
      else if (spread && s.correct === sel.correct) cls.push("peer");
    }

    node.className = cls.join(" ");
    node.querySelector("b").textContent = s.value;
    const mark = node.querySelector(".breakMark");
    if (bumps[s.id] === "broke") {
      if (!mark) node.insertAdjacentHTML("beforeend", HEARTBREAK);
    } else if (mark) mark.remove();
  });

  p.clues.forEach((row, i) => {
    const node = document.getElementById("row" + i);
    if (!node) return;
    node.classList.toggle("active", i === selClue);
    node.classList.toggle("solved", row.solved);
  });

  const spent = STRIKES - p.strikes;
  app.querySelectorAll(".life").forEach((n, i) => n.classList.toggle("spent", i < spent));

  app.querySelectorAll(".key.hot").forEach(n => n.classList.remove("hot"));
  /* glow names a letter once it has been revealed anywhere, so tapping that
     same index in the quote or in another clue still lights the key */
  if (S.glow && sel && p.num[sel.correct] &&
      p.slots.some(s => s.correct === sel.correct && s.locked)) {
    const key = app.querySelector('.key[data-key="' + sel.correct + '"]');
    if (key) key.classList.add("hot");
  }
}

function scrollClueIntoView() {
  const sel = S.p.slots[S.sel];
  if (!sel || sel.clue < 0) return;
  scrollRowIntoView(sel.clue);
}

function scrollRowIntoView(i) {
  const row = document.getElementById("row" + i);
  const box = app.querySelector(".clueScroll");
  if (!row || !box) return;
  const top = row.offsetTop, bot = top + row.offsetHeight;
  if (top < box.scrollTop + 4) box.scrollTo({ top: top - 8, behavior: "smooth" });
  else if (bot > box.scrollTop + box.clientHeight - 60) {
    box.scrollTo({ top: bot - box.clientHeight + 66, behavior: "smooth" });
  }
}

/* ------------------------------------------------------------ streak */

/*
 * Made up for now, but shaped like a real retention curve: almost everyone
 * strings two together, a run in the thirties is rare. Swap in real numbers once
 * there are any.
 */
function streakRarity(n) {
  const bands = [
    [2, 68], [4, 52], [9, 38], [14, 24], [19, 17], [29, 13]
  ];
  for (const b of bands) if (n <= b[0]) return b[1];
  return 10;
}

function themeDone() {
  const pre = packInfo().id + ":";
  return Object.keys(S.profile.done).filter(k => k.indexOf(pre) === 0).length;
}

function streakHtml() {
  const info = S.streakInfo;
  const best = S.profile.best;
  const isBest = info.streak >= best;
  return `
    <div class="streakScreen">
      <div class="streakHead">Win streak</div>
      <div class="streakNote">Solved back to back without giving up.
        Retry and Revive keep it alive &mdash; only walking away resets it.</div>
      <div class="streakHero">
        <div>
          <div class="streakN">${info.streak}</div>
          <div class="streakL">${info.streak === 1 ? "WIN IN A ROW" : "WINS IN A ROW"}</div>
        </div>
        <div class="chest ${info.reward ? "on" : ""}">${info.reward ? "&#128176;" : "&#128230;"}</div>
      </div>
      <div class="streakStats">
        <div class="sbox ${isBest ? "on" : ""}">
          <div class="n">${best}</div>
          <div class="l">BEST RUN</div>
          ${isBest ? `<div class="tagNew">NEW</div>` : ``}
        </div>
      </div>
      ${info.reward ? `<div class="rewardCard">&#127881; Five wins in a row &middot; +1 hint</div>` : ``}
      <div class="tapOn">TAP TO CONTINUE</div>
    </div>
    <div class="banner">BANNER AD</div>`;
}

/* ------------------------------------------------------------ review */

function reviewHtml() {
  const d = S.p.data;

  const paras = d.fact.map((text, i) => {
    if (i !== d.factPara) return `<p>${text}</p>`;
    return `<p>${text.slice(0, d.factStart)}<mark>${
      text.slice(d.factStart, d.factEnd)}</mark>${text.slice(d.factEnd)}</p>`;
  }).join("");

  const recap = d.clues.map((c, i) => `
    <div class="recapRow">
      <div class="w">${String.fromCharCode(65 + i)} &nbsp;${c.a}</div>
      <div class="c">${c.c}</div>
    </div>`).join("");

  const onFact = S.reviewTab === "fact";
  const next = S.pi + 1 < puzzles.length;

  return `
    <div class="reviewArt">${artSvg(d.art)}</div>
    <div class="reviewHead"><h2>${d.title}</h2></div>
    <div class="reviewBody">
      <div class="scrollinner">${onFact ? paras : `<div class="recap">${recap}</div>`}</div>
      <div class="rail"><div class="thumb"></div></div>
    </div>
    <div class="reviewCtas">
      <button class="btn ghost" data-act="flip">
        ${onFact ? "See the clues" : "Back to the fact"}
      </button>
      <button class="btn primary" data-act="next">${next ? "NEXT PUZZLE" : "BACK TO PACK"}</button>
    </div>
    <div class="banner">BANNER AD</div>`;
}

/* ============================================================= scroll rail */

function wireRail(innerSel, wrapSel) {
  const wrap = app.querySelector(wrapSel);
  if (!wrap) return;
  const inner = wrap.querySelector(innerSel) || app.querySelector(innerSel);
  const rail = wrap.querySelector(".rail");
  if (!inner || !rail) return;
  const thumb = rail.querySelector(".thumb");

  function update() {
    const ratio = inner.clientHeight / inner.scrollHeight;
    if (ratio >= 1) { rail.style.opacity = "0"; return; }
    rail.style.opacity = "1";
    const h = Math.max(28, rail.clientHeight * ratio);
    const max = rail.clientHeight - h;
    const p = inner.scrollTop / (inner.scrollHeight - inner.clientHeight);
    thumb.style.height = h + "px";
    thumb.style.transform = "translateY(" + (p * max) + "px)";
  }
  inner.addEventListener("scroll", update, { passive: true });
  requestAnimationFrame(update);
  setTimeout(update, 120);
}

/* ================================================================= events */

app.addEventListener("click", e => {
  const tab = e.target.closest("[data-pack]");
  if (tab) {
    const i = +tab.dataset.pack;
    if (i === S.pack) return;
    setPack(i);
    return render();
  }

  const openCard = e.target.closest("[data-open]");
  if (openCard) {
    const i = +openCard.dataset.open;
    /* a part-played puzzle goes straight back to the board, powerup and all */
    return S.profile.progress[keyOf(puzzles[i])] ? openPuzzle(i) : enterPuzzle(i);
  }

  const key = e.target.closest("[data-key]");
  if (key) {
    if (S.busy) return;
    const k = key.dataset.key;
    if (k === "DEL") return backspace();
    if (k === "LEFT") return retreat();
    if (k === "RIGHT") return advance();
    return typeLetter(k);
  }

  const cell = e.target.closest("[data-cell]");
  if (cell) {
    if (S.busy) return;
    const id = S.p.cellSlot[+cell.dataset.cell];
    if (id != null) selectSlot(id, "quote");
    return;
  }

  const ac = e.target.closest("[data-slot]");
  if (ac) {
    if (S.busy) return;
    return selectSlot(+ac.dataset.slot, "clue");
  }

  const act = e.target.closest("[data-act]");
  if (!act) return;
  switch (act.dataset.act) {
    case "home": if (S.p) saveProgress(); goHome(); break;
    case "hint": useHint(); break;
    case "revive": doRevive(); break;
    case "retry": doRetry(); break;
    case "askQuit": S.overlay = "confirm"; paintOverlay(); break;
    case "quitNo": S.overlay = "fail"; paintOverlay(); break;
    case "quitYes": abandon(); break;
    case "play": startPuzzle(); break;
    case "power": togglePower(act); break;
    case "glow": toggleGlow(act); break;
    case "flip": S.reviewTab = S.reviewTab === "fact" ? "clues" : "fact"; render(); break;
    case "next":
      if (S.pi + 1 < puzzles.length) enterPuzzle(S.pi + 1);
      else goHome();
      break;
  }
});

document.addEventListener("keydown", e => {
  if (S.screen !== "puzzle" || S.overlay || S.busy) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); return retreat(); }
  if (e.key === "ArrowRight") { e.preventDefault(); return advance(); }
  if (e.key === "Backspace") { e.preventDefault(); return backspace(); }
  if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); typeLetter(e.key.toUpperCase()); }
});

window.addEventListener("resize", () => {
  if (S.screen === "puzzle") fitQuote();
});

/* =================================================================== boot */

if (!PACKS.length || !puzzles.length) {
  app.innerHTML = `<div style="padding:40px;text-align:center;font-weight:800">
    No pack data.<br><span style="font-weight:600;color:#7B6A60;font-size:14px">
    Run <code>cscript //nologo tools\\build-puzzles.js</code> to generate it.</span></div>`;
} else {
  /* #3 opens puzzle 3 straight away, which saves a lot of tapping while testing */
  const jump = parseInt((location.hash || "").replace("#", ""), 10);
  if (jump >= 1 && jump <= puzzles.length) openPuzzle(jump - 1);
  else render();
}

})();
</script>
