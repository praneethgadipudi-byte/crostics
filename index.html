<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crostics</title>
<style>
/* ==========================================================================
   palette and frame
   ========================================================================== */
:root{
  --bg:#FFF7EF;
  --page:#F0E4D6;
  --card:#FFFFFF;
  --ink:#3B2F2A;
  --ink-soft:#7B6A60;
  --muted:#B6A79C;
  --line:#EFE2D5;

  --primary:#FF8A3D;
  --primary-dk:#EE7222;
  --primary-sh:#C85A12;
  --accent:#31BFA3;
  --accent-dk:#22A78D;
  --good:#3FBE80;
  --good-bg:#E4F7ED;
  --bad:#FF5F5F;
  --bad-bg:#FFE9E9;
  --gold:#FFB020;

  --cell:#FBEFE1;
  --cell-line:#EBD9C4;
  --cell-peer:#FFEBD2;
  --cell-link:#FFD9AE;

  --r-s:10px;
  --r-m:16px;
  --r-l:22px;
  --shadow:0 2px 0 rgba(59,47,42,.06), 0 8px 24px rgba(59,47,42,.07);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden}
body{
  margin:0;
  background:
    radial-gradient(1000px 600px at 50% -10%, #FFE9D2 0%, transparent 60%),
    var(--page);
  font-family:"Nunito","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
#app{
  width:100%; max-width:440px; height:100dvh; max-height:940px;
  background:var(--bg);
  display:flex; flex-direction:column;
  position:relative; overflow:hidden;
  box-shadow:0 30px 80px rgba(59,47,42,.22);
}
@media (min-width:520px) and (min-height:800px){
  #app{border-radius:28px; height:min(94dvh,940px)}
}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
::selection{background:var(--cell-link)}

/* ==========================================================================
   shared bits
   ========================================================================== */
.screen{display:flex;flex-direction:column;flex:1;min-height:0;animation:screenIn .28s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.banner{
  flex:none;height:56px;margin:0 12px 10px;border-radius:var(--r-s);
  border:1.5px dashed var(--cell-line);background:#FDF3E8;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.14em;
}

.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;
}
.pill.easy{background:#E4F7ED;color:#279C67}
.pill.medium,.pill.hard{background:#FFF1D9;color:#C88914}
.pill.vhard{background:#FFE6E6;color:#D9534F}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card);border:1.5px solid var(--line);
  padding:6px 12px;border-radius:999px;font-weight:900;font-size:14px;
  box-shadow:0 2px 0 rgba(59,47,42,.05);
}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--r-m);font-weight:900;letter-spacing:.02em;
  padding:15px 18px;transition:transform .08s ease, filter .15s ease;
}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-sh)}
.btn.primary:active{box-shadow:0 2px 0 var(--primary-sh)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 rgba(59,47,42,.06)}
.btn.mint{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-dk)}
.btn.mint:active{box-shadow:0 2px 0 var(--accent-dk)}
.btn[disabled]{opacity:.45;pointer-events:none}

.scrollbox{position:relative;flex:1;min-height:0;display:flex}
.scrollinner{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-right:12px}
.scrollinner::-webkit-scrollbar{display:none}
.rail{
  position:absolute;right:3px;top:6px;bottom:6px;width:5px;
  border-radius:3px;background:#F1E4D6;
}
.rail .thumb{
  position:absolute;left:0;width:5px;border-radius:3px;
  background:var(--cell-link);transition:opacity .3s ease;
}

/* ==========================================================================
   home
   ========================================================================== */
.homeHead{padding:22px 20px 14px}
.homeHead h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.02em}
.homeHead p{margin:5px 0 0;color:var(--ink-soft);font-size:14px;font-weight:600}
.homeStats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

.cardGrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:4px 20px 18px}
.pcard{
  background:var(--card);border-radius:var(--r-m);padding:13px;
  border:2px solid var(--line);box-shadow:var(--shadow);
  text-align:left;display:flex;flex-direction:column;gap:8px;
  min-height:132px;position:relative;overflow:hidden;
  transition:transform .1s ease;
}
.pcard:active{transform:scale(.97)}
.pcard .art{height:44px;display:flex;align-items:center}
.pcard .art svg{height:44px;width:auto}
.pcard .no{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.1em}
.pcard .nm{font-size:14px;font-weight:900;line-height:1.2}
.pcard .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.pcard.done{border-color:#CFEEDD;background:linear-gradient(180deg,#F6FFFA,#fff)}
.tick{width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:900}
.pcard.locked{opacity:.5;pointer-events:none}
.resume{font-size:11px;font-weight:900;color:var(--primary)}
.pcard.soon{opacity:.62;background:#FDF6EE;border-style:dashed;cursor:default}
.pcard.soon .nm{color:var(--muted)}
.soonIcon{font-size:26px;opacity:.5}

/* theme tabs: five packs of ten, one row above the banner */
.tabbar{
  flex:none;display:flex;gap:5px;padding:8px 12px 10px;margin:0 2px;
  border-top:2px solid var(--line);background:var(--bg);
}
.tab{
  flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px 6px;border-radius:14px;border:2px solid transparent;
  transition:background .15s ease, border-color .15s ease;
}
.tab .te{font-size:19px;line-height:1;filter:grayscale(.55) opacity(.7)}
.tab .tn{font-size:9.5px;font-weight:900;letter-spacing:.04em;color:var(--muted)}
.tab.on{background:#FFF3E6;border-color:#FFD9AE}
.tab.on .te{filter:none}
.tab.on .tn{color:var(--primary-dk)}
.tab:active{transform:translateY(1px)}
/* marks a theme that has no puzzles yet */
.tab .tdot{
  position:absolute;top:5px;right:calc(50% - 17px);
  width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.55;
}

/* ==========================================================================
   intro overlay, sitting over a dimmed view of the board it is about to open
   ========================================================================== */
.introVeil{
  position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(52,37,30,.84),rgba(34,23,18,.95));
  animation:fade .22s ease both;
}
.introHead{flex:none;padding:14px 16px 0}
.introHead .iconbtn{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.introMain{
  flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;padding:4px 18px 10px;text-align:center;color:#fff;
}
.introKicker{font-size:11px;font-weight:900;letter-spacing:.16em;color:rgba(255,255,255,.6)}
.introTitle{margin:0;font-size:29px;font-weight:900;line-height:1.1;letter-spacing:-.02em}

/* the streak carries the most weight after the title */
.introStreak{
  display:flex;align-items:center;gap:10px;padding:9px 18px 9px 13px;border-radius:999px;
  background:rgba(255,138,61,.2);border:1.5px solid rgba(255,168,110,.5);
}
.introStreak .f{font-size:22px;line-height:1}
.introStreak .n{font-size:28px;font-weight:900;color:#FFB27A;line-height:1}
.introStreak .l{font-size:9px;font-weight:900;letter-spacing:.11em;
  color:rgba(255,255,255,.72);text-align:left;line-height:1.2}
.introProof{font-size:12px;font-weight:800;color:#9BE6BE;line-height:1.35;max-width:280px}
.introCoins{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
.powerRow{display:flex;gap:10px;justify-content:center;width:100%}

/* the powerup, off by default: turning it on costs an ad watch */
.powerSquare{
  width:148px;aspect-ratio:1;flex:none;
  background:var(--card);border:2px solid var(--line);border-radius:22px;
  box-shadow:0 14px 34px rgba(0,0,0,.34);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:border-color .18s ease, background .18s ease;
}
.powerSquare.on{border-color:var(--primary);background:#FFFBF6}
.powerSquare .psBadge{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:#F3E7DA;color:var(--muted);font-size:11px;font-weight:900;
  transition:background .18s ease, color .18s ease;
}
.powerSquare.on .psBadge{background:var(--primary);color:#fff}
.powerSquare .psTitle{font-size:15.5px;font-weight:900;color:var(--ink)}
.powerSquare .psWatch{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.sw{
  position:relative;flex:none;width:74px;height:30px;border-radius:999px;
  background:#EFE2D5;border:2px solid var(--line);margin-top:2px;
  transition:background .18s ease, border-color .18s ease;
}
.sw i{
  position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(59,47,42,.28);
  transition:transform .18s cubic-bezier(.2,1.2,.4,1);
}
.sw span{
  position:absolute;top:0;bottom:0;right:9px;display:flex;align-items:center;
  font-size:9.5px;font-weight:900;letter-spacing:.06em;color:var(--muted);
  transition:color .18s ease;
}
.powerSquare.on .sw{background:var(--primary);border-color:var(--primary)}
.powerSquare.on .sw i{transform:translateX(44px)}
.powerSquare.on .sw span{right:auto;left:10px;color:#fff}
.introBenefit{font-size:12.5px;font-weight:800;color:#9BE6BE;line-height:1.4;max-width:290px}
.introPlay{width:100%;max-width:320px;margin-top:2px;font-size:17px}
.introVeil .banner{
  border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.07);
  color:rgba(255,255,255,.62);
}

/* ==========================================================================
   puzzle screen
   ========================================================================== */
.topbar{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:14px 14px 10px;
}
.iconbtn{
  width:38px;height:38px;border-radius:12px;background:var(--card);
  border:2px solid var(--line);display:grid;place-items:center;
  box-shadow:0 2px 0 rgba(59,47,42,.06);flex:none;
}
.iconbtn:active{transform:translateY(1px)}
.topbar .titles{flex:1;min-width:0}
.topbar .t1{font-size:15px;font-weight:900;line-height:1.1}
.topbar .t2{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-top:2px}

.lives{display:flex;gap:6px;flex:none;align-items:center}
.life{width:22px;height:20px;display:grid;place-items:center;position:relative}
.life svg{width:22px;height:20px;display:block}
.life .empty{display:none}
.life.spent .full{display:none}
.life.spent .empty{display:block}
.life.pop{animation:lifePop .45s ease}
@keyframes lifePop{0%{transform:scale(1)}35%{transform:scale(1.45)}100%{transform:scale(1)}}
.cell.broke{background:var(--bad-bg);border-color:#F3AFAF}
.cell.broke b{display:none}
.cell.broke .breakMark{position:absolute;inset:0;display:grid;place-items:center}
.cell.broke .breakMark svg{width:70%;height:70%}

/* names the half of the screen the puzzle is really about, and states the win
   condition once so the two grids do not have to explain themselves */
.quoteHead{flex:none;margin:0 14px 6px}
.qhTitle{
  font-size:12px;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;color:var(--primary);
}
.qhSub{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:1px}

.quoteCard{
  flex:none;margin:2px 14px 12px;padding:14px 12px;
  background:var(--card);border:2px solid var(--line);
  border-radius:var(--r-l);box-shadow:var(--shadow);
}
/* finishing the quote is the middle milestone, so the card itself reacts */
.quoteCard.done{
  border-color:var(--good);
  box-shadow:0 0 0 4px rgba(63,190,128,.22), var(--shadow);
  animation:cardGlow 1.4s ease both;
}
@keyframes cardGlow{0%{transform:scale(1)}18%{transform:scale(1.025)}100%{transform:scale(1)}}
.quoteGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 0}
.qword{display:flex;gap:3px;margin:0 5px}
.qpunc{align-self:flex-end;font-weight:900;font-size:15px;color:var(--ink-soft);padding-bottom:3px}

.cell{
  width:var(--cw);height:calc(var(--cw) * 1.34);
  border-radius:6px;background:var(--cell);
  border:1.5px solid var(--cell-line);
  display:grid;place-items:center;position:relative;
  font-weight:900;font-size:var(--cf);line-height:1;
  color:var(--ink);cursor:pointer;
  transition:background .15s ease, border-color .15s ease, transform .1s ease;
}
/* the letter sits below the index strip rather than fighting it for the centre */
.cell b{display:block;padding-top:calc(var(--ixf) * 0.9)}
.cell .ix{
  position:absolute;top:1px;left:0;right:0;text-align:center;
  font-size:var(--ixf);font-weight:800;line-height:1;
  color:var(--muted);letter-spacing:0;
}
.cell.free .ix{color:#C4B3A0}
/* every other cell of the selected letter, in the quote and in the clue list.
   Part of the key guide rather than plain play, so it can carry real contrast
   alongside the key it lights up. */
.cell.peer{background:var(--cell-link);border-color:#E9A055;border-width:2px}
.cell.peer .ix{color:#B4661C}
.cell.sel{border-color:var(--primary);border-width:2.5px;background:#fff;
  box-shadow:0 0 0 3px rgba(255,138,61,.18)}
.cell.wrong{background:var(--bad-bg);border-color:#F3AFAF;color:var(--bad)}
/* solved letters carry the strongest fill on the board so progress is obvious
   at a glance, and they outrank the peer tint that would dilute it */
.cell.lock{
  background:#BDEDD2;border:2px solid var(--good);
  color:#15734A;cursor:default;
}
.cell.lock .ix{color:#2F9C68}
/* a solved cell still has to show that it belongs to the letter being pointed
   at, so it keeps the green fill and takes the amber ring on top */
.cell.lock.peer,
.cell.lock.sel{
  border-color:#E9A055;border-width:2.5px;
  box-shadow:0 0 0 3px rgba(233,160,85,.36);
}
.cell.lock.peer .ix,
.cell.lock.sel .ix{color:#B4661C}
/* an unindexed cell keeps its dashed edge even once solved */
.cell.lock.free{border-style:dashed}
.cell.pop{animation:cellPop .3s ease}
@keyframes cellPop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.cell.shake{animation:shake .32s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* clue list */
.clueWrap{position:relative;flex:1;min-height:0;margin:0 14px;display:flex}
.clueScroll{
  flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;
  padding:2px 14px 72px 0;
}
.clueScroll::-webkit-scrollbar{display:none}

.clueRow{
  display:flex;gap:10px;align-items:center;
  padding:9px 10px;border-radius:var(--r-m);margin-bottom:7px;
  background:var(--card);border:2px solid transparent;position:relative;
  transition:border-color .15s ease, background .15s ease;
}
/* the smallest of the three rewards: a green sweep across the row that just
   came out, enough to notice without interrupting the next guess */
.clueRow.justSolved{animation:rowNudge .5s ease}
@keyframes rowNudge{0%,100%{transform:scale(1)}40%{transform:scale(1.02)}}
.clueRow.justSolved::after{
  content:"";position:absolute;inset:0;border-radius:var(--r-m);pointer-events:none;
  background:linear-gradient(100deg,transparent 22%,rgba(63,190,128,.36) 50%,transparent 78%);
  background-size:240% 100%;animation:rowSweep .7s ease-out both;
}
@keyframes rowSweep{from{background-position:130% 0}to{background-position:-130% 0}}
.clueRow.justSolved .lbl{animation:lblPop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes lblPop{0%{transform:scale(1)}45%{transform:scale(1.38)}100%{transform:scale(1)}}
.clueRow.stack{flex-direction:column;align-items:stretch;gap:7px}
.clueRow.active{border-color:#FFD9AE;background:#FFFDF9}
.clueRow.solved{background:#F7FCF9}
.clueRow .lbl{
  flex:none;width:22px;height:22px;border-radius:7px;background:#F3E7DA;
  display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--ink-soft);
}
.clueRow.solved .lbl{background:var(--good);color:#fff}
.clueHead{display:flex;gap:9px;align-items:flex-start;flex:1;min-width:0}
.clueRow .txt{font-size:13.5px;font-weight:700;line-height:1.32;color:var(--ink)}
.clueRow.solved .txt{color:var(--ink-soft)}
.ansCells{display:flex;gap:3px;flex-wrap:wrap;flex:none}
.clueRow.stack .ansCells{padding-left:31px}
.ansCells .cell{--cw:26px;--cf:14px;--ixf:8px}

.hintBtn{
  display:flex;align-items:center;justify-content:center;
  background:var(--card);border:2px solid var(--line);
  width:52px;height:52px;padding:0;border-radius:16px;
  font-weight:900;font-size:26px;line-height:1;
  box-shadow:0 4px 14px rgba(59,47,42,.14);
}
.hintStack{
  position:absolute;right:8px;bottom:12px;z-index:3;
  display:flex;flex-direction:row;align-items:center;gap:8px;
}
.hintBtn:active{transform:translateY(2px)}
.hintBtn.empty{color:var(--muted)}
/* keyboard */
.kb{flex:none;padding:8px 6px 6px;display:flex;flex-direction:column;gap:6px}
.krow{display:flex;gap:5px;justify-content:center}
.key{
  flex:1;max-width:38px;height:44px;border-radius:9px;
  background:var(--card);box-shadow:0 2px 0 #E3D4C4;
  display:grid;place-items:center;font-weight:900;font-size:16px;
}
.key:active{transform:translateY(2px);box-shadow:0 0 0 #E3D4C4}
.key.wide{max-width:56px;background:#F3E7DA}
.key.hot{background:var(--primary);color:#fff;box-shadow:0 2px 0 var(--primary-sh)}

/* ==========================================================================
   overlays
   ========================================================================== */
.veil{
  position:absolute;inset:0;z-index:50;
  background:rgba(59,47,42,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;
  animation:fade .2s ease both;
}
@keyframes fade{from{opacity:0}to{opacity:1}}

.sheet{
  width:100%;background:var(--card);border-radius:26px;padding:24px 20px 20px;
  position:relative;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);
  animation:sheetIn .3s cubic-bezier(.2,1.2,.4,1) both;
}
@keyframes sheetIn{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}
.sheet h2{margin:0 0 6px;font-size:22px;font-weight:900}
.sheet p{margin:0 0 16px;color:var(--ink-soft);font-size:14px;font-weight:600;line-height:1.4}
.closeX{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;
  background:#F3E7DA;display:grid;place-items:center;font-weight:900;color:var(--ink-soft)}
.streakBox{
  background:#FFF6E8;border:2px solid #FFE3BE;border-radius:var(--r-m);
  padding:12px;margin-bottom:16px;
}
.streakBox .n{font-size:30px;font-weight:900;color:var(--primary)}
.streakBox .l{font-size:11.5px;font-weight:900;color:#C88914;letter-spacing:.1em}
.sheet .btn{width:100%;margin-top:9px}
.costTag{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.25);
  padding:3px 9px;border-radius:999px;font-size:13px}

.adFull{
  position:absolute;inset:0;z-index:80;background:#221B17;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.adFull .tag{font-size:11px;font-weight:900;letter-spacing:.3em;color:#8C7A6C}
.adFull .big{font-size:26px;font-weight:900;letter-spacing:.02em}
.adBar{width:150px;height:5px;border-radius:3px;background:#3A2F28;overflow:hidden}
.adBar i{display:block;height:100%;background:var(--primary);width:0;animation:adGo 2s linear forwards}
@keyframes adGo{to{width:100%}}

.cheer{
  position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;pointer-events:none;
  background:rgba(255,247,239,.72);
}
.cheer .big{font-size:38px;font-weight:900;color:var(--primary);
  animation:cheerIn .5s cubic-bezier(.2,1.4,.4,1) both}
.cheer .sub{font-size:15px;font-weight:800;color:var(--ink-soft);
  animation:cheerIn .5s .12s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cheerIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#confetti{position:absolute;inset:0;z-index:71;pointer-events:none}
/* the quote celebration paints over the board rather than over the app */
.fx{position:absolute;inset:0;z-index:46;pointer-events:none}
.midCheer{
  position:absolute;left:50%;top:34%;z-index:47;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:rgba(63,190,128,.96);color:#fff;padding:12px 22px;border-radius:18px;
  box-shadow:0 12px 30px rgba(47,156,104,.42);animation:midCheer 1.5s ease both;
}
.midCheer b{font-size:16px;font-weight:900;letter-spacing:.06em}
.midCheer span{font-size:12px;font-weight:800;opacity:.92}
@keyframes midCheer{
  0%{opacity:0;transform:translate(-50%,-40%) scale(.8)}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  78%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-58%) scale(1)}
}

.toast{
  position:absolute;left:50%;bottom:112px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;
  font-size:13px;font-weight:800;z-index:60;animation:toastIn 2s ease both;
}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,8px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ==========================================================================
   streak screen
   ========================================================================== */
.streakScreen{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:22px;text-align:center;gap:4px}
.flame{font-size:62px;animation:flameIn .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes flameIn{from{opacity:0;transform:scale(.4) rotate(-14deg)}to{opacity:1;transform:none}}
.streakN{font-size:58px;font-weight:900;line-height:1;color:var(--primary)}
.streakL{font-size:13px;font-weight:900;letter-spacing:.16em;color:var(--ink-soft)}
.streakHero{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0 4px}
.streakHero .chest{
  width:64px;height:64px;border-radius:18px;background:#FFF6E8;border:2px solid #FFE3BE;
  display:grid;place-items:center;font-size:32px;
}
.streakHero .chest.on{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,176,32,.22)}
.streakHead{font-size:22px;font-weight:900;letter-spacing:-.02em}
/* the wording has to say wins, not days, or the run reads like a calendar */
.streakNote{margin-top:6px;max-width:300px;font-size:12.5px;font-weight:700;
  line-height:1.4;color:var(--ink-soft)}
.streakStats{display:flex;gap:10px;margin-top:16px;width:100%;max-width:320px}
.sbox{
  flex:1;position:relative;background:var(--card);border:2px solid var(--line);
  border-radius:var(--r-m);padding:11px 8px;box-shadow:0 2px 0 rgba(59,47,42,.05);
}
.sbox.on{border-color:#FFD9AE;background:#FFFBF5}
.sbox .n{font-size:24px;font-weight:900;line-height:1.1;color:var(--ink)}
.sbox .l{margin-top:3px;font-size:9.5px;font-weight:900;letter-spacing:.11em;color:var(--muted)}
.sbox .tagNew{
  position:absolute;top:-8px;right:-6px;background:var(--primary);color:#fff;
  font-size:9px;font-weight:900;letter-spacing:.08em;padding:3px 7px;border-radius:999px;
}
.streakProof{margin-top:12px;max-width:300px;font-size:12.5px;font-weight:800;
  line-height:1.4;color:#279C67}
.progWrap{width:100%;margin-top:22px;max-width:320px}
.progTop{display:flex;justify-content:space-between;font-size:12px;font-weight:900;
  color:var(--ink-soft);margin-bottom:7px}
.progBar{height:16px;border-radius:999px;background:#F1E2D2;overflow:hidden;position:relative}
.progBar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#FFB020,var(--primary));width:0;
  transition:width .9s cubic-bezier(.3,1,.4,1)}
.pips{display:flex;justify-content:space-between;margin-top:8px}
.pip{width:13px;height:13px;border-radius:50%;background:#EBDCCB}
.pip.on{background:var(--primary)}
.pip.goal{width:22px;height:22px;margin-top:-5px;background:#FFF;border:2.5px solid #EBDCCB;
  display:grid;place-items:center;font-size:10px}
.pip.goal.on{border-color:var(--gold);background:#FFF6E4}
.tapOn{
  margin-top:24px;font-size:11px;font-weight:900;letter-spacing:.22em;
  color:var(--muted);animation:blink 1.8s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.rewardCard{
  margin-top:16px;background:#FFF6E8;border:2px solid #FFE3BE;border-radius:var(--r-m);
  padding:14px 18px;font-weight:900;color:#C88914;font-size:14px;
  animation:sheetIn .5s .5s both;
}

/* ==========================================================================
   review screen
   ========================================================================== */
.reviewArt{
  flex:none;margin:12px 14px 0;height:132px;border-radius:var(--r-l);
  background:linear-gradient(160deg,#FFE7CC,#FFF4E6);
  border:2px solid var(--line);display:grid;place-items:center;overflow:hidden;
}
.reviewArt svg{height:104px;width:auto}
.reviewHead{padding:14px 20px 8px}
.reviewHead h2{margin:0;font-size:21px;font-weight:900;letter-spacing:-.01em}
.reviewBody{margin:0 14px;flex:1;min-height:0;display:flex;position:relative}
.reviewBody .scrollinner{padding:0 16px 8px 6px}
.reviewBody p{margin:0 0 13px;font-size:14px;line-height:1.6;font-weight:600;color:#4E403A}
.reviewBody mark{
  background:linear-gradient(180deg,transparent 52%,#FFDFAE 52%);
  color:var(--ink);font-weight:800;padding:0 1px;border-radius:2px;
}
.recap{display:flex;flex-direction:column;gap:8px;padding-right:4px}
.recapRow{display:flex;gap:10px;align-items:baseline;background:var(--card);
  border:2px solid var(--line);border-radius:var(--r-s);padding:10px 12px}
.recapRow .w{font-weight:900;font-size:13px;color:var(--primary-dk);
  letter-spacing:.06em;flex:none;min-width:74px}
.recapRow .c{font-size:13px;font-weight:600;color:var(--ink-soft);line-height:1.35}
.reviewCtas{flex:none;padding:10px 16px 4px;display:flex;flex-direction:column;gap:9px}
</style>
</head>

const PACK_DATA = [{"pack":{"id":"food-origins","name":"Food Origins","blurb":"Ten true stories about where dinner came from."},"tab":"Food","emoji":"&#127869;","puzzles":[{"id":1,"band":"easy","title":"The Purple Carrot","art":"carrot","quote":"Wild carrots were purple, not orange.","fact":["Long before the carrot became the tidy orange stick in your fridge, it grew across Persia and Afghanistan as a thin, forked, strong smelling root. Wild carrots were purple, not orange. Farmers of the time valued the plant as much for its aromatic seeds and feathery leaves as for anything underground.","The orange carrot is a surprisingly modern invention. Dutch growers in the sixteenth and seventeenth centuries kept selecting for a fatter, sweeter, less woody root, and the colour that came along for the ride was beta carotene. The vegetable we now treat as the definition of healthy eating is essentially a bred product of a few hundred years of patient gardening.","Purple carrots never actually vanished. They stayed in kitchens across Turkey, Iran and India, and they have quietly returned to European markets in the last twenty years, sold at a premium as something exotic and new."],"factPara":0,"factStart":147,"factEnd":184,"clues":[{"a":"WILLOW","c":"Tree that weeps by the water","m":[11,1,2,19,24,0]},{"a":"SUGAR","c":"It once travelled as treasure","m":[10,16,28,26,6]},{"a":"PECAN","c":"Nut at the heart of a pie","m":[15,20,4,5,21]},{"a":"RIND","c":"Tough skin of a cheese or melon","m":[17,-1,27,3]},{"a":"TOP","c":"The best, or a spinning toy","m":[9,8,18]},{"a":"TOE","c":"You stub it in the dark","m":[23,22,29]},{"a":"ORE","c":"Rock worth digging up","m":[-1,13,12]},{"a":"EAR","c":"Corn grows in one, and you listen with one","m":[14,-1,7]}],"free":[25],"hide":["C","G"],"stats":{"score":106.4,"letters":30,"clues":8,"distinct":15,"hidden":2,"hideShare":0.067,"freeQuote":1,"freeAnswer":3,"vowelRatio":0.367,"commonShare":0.667,"stopShare":0.233,"pairLoad":0.56,"avgLen":4}},{"id":2,"band":"easy","title":"Chocolate Currency","art":"cacao","quote":"Cacao beans were once used as actual money.","fact":["Cacao beans were once used as actual money. Across the Maya and later the Aztec world, prices were quoted in beans the way we quote them in coins. A turkey might cost a hundred beans, a ripe avocado around three, and a day of a labourer's work perhaps the same again.","Anything valuable enough to spend is valuable enough to fake. Archaeologists have found hollow cacao husks carefully repacked with clay and mud, which is about the oldest counterfeiting scheme we have physical evidence for. Merchants learned to weigh and rattle their beans before agreeing to a deal.","The drink those beans became would be almost unrecognisable today. It was unsweetened, poured from height to raise a thick foam, and often spiked with chilli, vanilla or annatto. Sugar only entered the story much later, in Europe."],"factPara":0,"factStart":0,"factEnd":43,"clues":[{"a":"CURRY","c":"A dish that travelled the world","m":[25,27,-1,12,34]},{"a":"WOMBAT","c":"Its burrow has separate rooms","m":[10,14,30,5,3,26]},{"a":"SAUCE","c":"It rescues a dull dish","m":[23,24,18,16,6]},{"a":"COCOA","c":"Warm drink for cold hands","m":[0,4,2,31,1]},{"a":"SALAD","c":"Raw vegetables making an effort","m":[19,28,29,7,21]},{"a":"EASE","c":"Comfort, or to loosen a grip","m":[13,22,9,11]},{"a":"NEON","c":"Gas that made signs glow","m":[15,20,-1,8]},{"a":"NET","c":"It catches fish and stops goals","m":[32,17,-1]}],"free":[33],"hide":["D","M"],"stats":{"score":109.8,"letters":35,"clues":8,"distinct":15,"hidden":2,"hideShare":0.057,"freeQuote":1,"freeAnswer":3,"vowelRatio":0.486,"commonShare":0.657,"stopShare":0.286,"pairLoad":0.73,"avgLen":4.63}},{"id":3,"band":"easy","title":"The Jar That Never Spoiled","art":"honey","quote":"Honey sealed in ancient tombs is still edible.","fact":["Honey sealed in ancient tombs is still edible. Excavators working in Egypt have opened pots left undisturbed for thousands of years and found the contents unspoiled, thick and golden, needing nothing more than a gentle warming to pour again.","The reason is chemistry rather than magic. Honey holds very little free water, which leaves nothing for bacteria to live on, and it is naturally acidic. Bees also add an enzyme that slowly releases tiny amounts of hydrogen peroxide. Between them, those three defences make an environment almost nothing can grow in.","The one thing that will ruin a jar is moisture. Left open in a damp kitchen, honey absorbs water from the air and can finally ferment, which is exactly how mead was discovered."],"factPara":0,"factStart":0,"factEnd":46,"clues":[{"a":"THYME","c":"Small leaves, big in a stew","m":[20,0,4,22,32]},{"a":"BACON","c":"It made breakfast smell famous","m":[35,7,15,1,12]},{"a":"BASIL","c":"Herb that makes pesto pesto","m":[23,13,5,29,8]},{"a":"LENTIL","c":"Tiny pulse that thickens a stew","m":[36,17,18,19,11,31]},{"a":"TENDON","c":"Rope tying muscle to bone","m":[28,37,14,33,21,2]},{"a":"SHIELD","c":"A wall you carry with you","m":[26,-1,16,3,30,10]},{"a":"IRIS","c":"Flower, or the coloured ring in your eye","m":[25,-1,34,24]},{"a":"SET","c":"A collection, or what jelly does","m":[27,9,-1]}],"free":[6],"hide":["Y","C"],"stats":{"score":113.4,"letters":38,"clues":8,"distinct":14,"hidden":2,"hideShare":0.053,"freeQuote":1,"freeAnswer":3,"vowelRatio":0.395,"commonShare":0.711,"stopShare":0.237,"pairLoad":0.87,"avgLen":5}},{"id":4,"band":"medium","title":"The Poison Apple","art":"tomato","quote":"Europeans once feared the tomato as deadly poison.","fact":["Europeans once feared the tomato as deadly poison. When Spanish ships carried it back from the Americas in the sixteenth century, botanists took one look at the plant and recognised the family. It was an obvious relative of deadly nightshade, so for well over a century the tomato was grown as an ornamental curiosity and kept firmly out of the kitchen.","There was also a genuine reason people fell ill. Wealthy households ate from pewter plates with a high lead content, and the acid in a tomato pulled that lead straight out into the food. The poor, eating from wood and clay, ate tomatoes happily and suffered nothing at all.","Naples eventually settled the argument. Poor southern Italian cooks put the fruit on flatbread because it was cheap and it kept well, and the dish they invented travelled the world under the name pizza."],"factPara":0,"factStart":0,"factEnd":50,"clues":[{"a":"PAPYRUS","c":"Reed that carried the first writing","m":[4,15,36,35,2,1,29]},{"a":"FEATHER","c":"It keeps a bird up and warm","m":[13,14,32,26,20,12,16]},{"a":"COSMOS","c":"Everything there is, in one word","m":[11,37,8,24,3,39]},{"a":"ONION","c":"It makes you cry while helping","m":[40,7,38,9,41]},{"a":"LADDER","c":"Steps you can carry","m":[34,28,18,30,5,-1]},{"a":"OATS","c":"Breakfast grain that thickens","m":[27,6,19,-1]},{"a":"NOD","c":"Silent yes","m":[10,23,33]},{"a":"TEA","c":"Leaves that started a revolution","m":[22,-1,25]},{"a":"EEL","c":"Long swimmer often mistaken for a snake","m":[21,0,-1]}],"free":[17,31],"hide":["D","P","S"],"stats":{"score":131.6,"letters":42,"clues":9,"distinct":17,"hidden":3,"hideShare":0.19,"freeQuote":2,"freeAnswer":4,"vowelRatio":0.476,"commonShare":0.738,"stopShare":0.214,"pairLoad":0.84,"avgLen":4.89}},{"id":5,"band":"medium","title":"Two Years For One Fruit","art":"pineapple","quote":"One pineapple plant can take nearly two years to ripen.","fact":["One pineapple plant can take nearly two years to ripen. It is a slow, spiky, unglamorous crop that produces a single fruit at the centre of a rosette of tough leaves, and once it has done so the parent plant is finished.","That slowness explains why the pineapple became a symbol of outrageous wealth in eighteenth century Europe. Growing one in a cold climate meant building a heated glasshouse and paying a gardener to nurse it for two years. A single fruit could cost the equivalent of a small house, so hosts displayed them rather than ate them, and there was a brisk trade in renting a pineapple for the evening.","There is a further oddity in the fruit itself. What looks like one pineapple is actually dozens of separate flowers that fused as they grew, which is why the skin is patterned in those tessellated hexagons."],"factPara":0,"factStart":0,"factEnd":55,"clues":[{"a":"YELLOW","c":"Colour of butter and lemons","m":[29,2,10,28,39,31]},{"a":"PICKLE","c":"Vegetable saved by vinegar","m":[9,4,17,22,13,34]},{"a":"PANTRY","c":"Cupboard the cook trusts","m":[42,18,44,38,27,33]},{"a":"PEPPER","c":"It travelled further than most people","m":[8,6,12,3,11,36]},{"a":"TOAST","c":"Bread that met the fire again","m":[20,32,7,37,16]},{"a":"ORANGE","c":"Fruit and colour in one word","m":[0,40,26,19,-1,23]},{"a":"MINT","c":"Cool herb, or where coins are made","m":[-1,41,15,30]},{"a":"BEAN","c":"It can be baked, roasted or ground","m":[-1,25,14,1]},{"a":"INN","c":"Old roadside stop with beds and beer","m":[-1,5,24]}],"free":[21,35,43],"hide":["L","Y","O"],"stats":{"score":134.3,"letters":45,"clues":9,"distinct":14,"hidden":3,"hideShare":0.178,"freeQuote":3,"freeAnswer":4,"vowelRatio":0.4,"commonShare":0.711,"stopShare":0.244,"pairLoad":1.14,"avgLen":5.11}},{"id":6,"band":"medium","title":"Berry Confusion","art":"banana","quote":"To a botanist the banana is a berry and the strawberry is not.","fact":["To a botanist the banana is a berry and the strawberry is not. A berry has a strict definition: it grows from a single flower with one ovary, and it carries its seeds inside the flesh. Bananas, grapes, tomatoes and even cucumbers all pass that test comfortably.","A strawberry fails on every count. What you eat is a swollen flower base rather than an ovary, and the real fruits are the tiny specks on the outside, each one a separate seed carrier. The proper term is an aggregate accessory fruit, which is not something anyone wants printed on a jam label.","The banana plant is misfiled too. It is not a tree but the largest herb on earth, with a false trunk made of tightly wrapped leaf bases. Nearly every banana sold for export is a clone of a single variety, which is why one determined fungus can threaten the entire trade."],"factPara":0,"factStart":0,"factEnd":62,"clues":[{"a":"HONEY","c":"The only food that never spoils","m":[12,47,46,33,27]},{"a":"DAIRY","c":"Where milk becomes everything else","m":[30,17,20,36,43]},{"a":"WHEAT","c":"The grain behind most bread","m":[38,32,13,22,31]},{"a":"RIBBON","c":"It ties the parcel","m":[26,8,3,39,1,18]},{"a":"RABBIT","c":"It gets into the vegetable patch","m":[25,2,23,14,44,0]},{"a":"CARROT","c":"Root that was purple first","m":[-1,37,42,41,4,35]},{"a":"TASTE","c":"Only five of them, officially","m":[5,19,9,10,24]},{"a":"PASTA","c":"It comes in a hundred shapes","m":[-1,6,45,48,28]},{"a":"YEAST","c":"Tiny fungus that lifts the loaf","m":[-1,40,15,34,11]},{"a":"SON","c":"Boy in the family tree","m":[21,-1,29]}],"free":[7,16],"hide":["O","I","B"],"stats":{"score":135.4,"letters":49,"clues":10,"distinct":13,"hidden":3,"hideShare":0.204,"freeQuote":2,"freeAnswer":4,"vowelRatio":0.367,"commonShare":0.837,"stopShare":0.408,"pairLoad":1.03,"avgLen":5.1}},{"id":7,"band":"hard","title":"Four Thousand Year Old Noodles","art":"noodle","quote":"The oldest bowl of noodles ever unearthed was made from millet.","fact":["In 2005 archaeologists digging at Lajia in north west China lifted an upturned earthenware bowl that had been buried by a flood roughly four thousand years ago. Underneath, protected by a pocket of air, sat a coil of thin yellow strands. The oldest bowl of noodles ever unearthed was made from millet.","That detail matters more than it sounds. Millet has almost no gluten, so those noodles could not have been rolled and cut in the familiar way. They were most likely pushed through a press or repeatedly stretched from a dough held together by sheer technique, which suggests a well developed cooking tradition rather than a first experiment.","The find did not settle the endless argument about who invented the noodle. Wheat noodles, Arab dried pasta and Italian pasta all have their own long histories and their own evidence, and the honest answer is that people in several places independently worked out that dough could be made into strings."],"factPara":0,"factStart":238,"factEnd":301,"clues":[{"a":"MUFFIN","c":"Breakfast cake, in denial","m":[45,26,42,14,47,27]},{"a":"HARVEST","c":"The payoff for a whole season","m":[1,39,30,23,2,21,51]},{"a":"MEADOW","c":"Field of grass and wildflowers","m":[38,41,29,18,3,11]},{"a":"WOMBAT","c":"Its burrow has separate rooms","m":[35,13,46,9,36,31]},{"a":"SHUTTLE","c":"Reusable ride up to orbit","m":[7,32,-1,0,8,49,20]},{"a":"SEED","c":"The whole plant, packed small","m":[37,22,33,34]},{"a":"LADDER","c":"Steps you can carry","m":[48,-1,40,5,50,25]},{"a":"LEMON","c":"Sour yellow fixer of everything","m":[12,28,-1,16,15]},{"a":"ROLL","c":"Small bread, or what dough does","m":[43,-1,19,4]},{"a":"BEE","c":"Tiny worker behind every honey jar","m":[-1,6,24]}],"free":[10,17,44],"hide":["M","A","S","R"],"stats":{"score":153.3,"letters":52,"clues":10,"distinct":17,"hidden":4,"hideShare":0.231,"freeQuote":3,"freeAnswer":5,"vowelRatio":0.385,"commonShare":0.635,"stopShare":0.308,"pairLoad":1.12,"avgLen":5.4}},{"id":8,"band":"hard","title":"Spuds In Space","art":"potato","quote":"A potato became the first food ever grown in orbit above our planet.","fact":["A potato became the first food ever grown in orbit above our planet. In 1995 a joint experiment between NASA and the University of Wisconsin carried potato cuttings aboard the shuttle Columbia and produced tubers in weightlessness, proving that a crop could complete part of its life cycle away from the ground.","The potato was not a random choice. It yields more calories per square metre than almost anything else, it stores well, it grows from cuttings rather than seed, and nearly the whole plant is useful. Those are exactly the qualities you want when every gram of cargo is costed to the penny.","On earth the potato has done this before. Domesticated in the Andes thousands of years ago, where farmers still grow a startling range of shapes and colours, it later spread across Europe and quietly rewrote the population history of an entire continent."],"factPara":0,"factStart":0,"factEnd":68,"clues":[{"a":"WAFFLE","c":"Grid you pour syrup into","m":[32,51,16,21,50,25]},{"a":"VIVID","c":"So bright it stays with you","m":[26,34,44,39,24]},{"a":"NUTMEG","c":"Spice grated over custard","m":[52,47,13,11,15,29]},{"a":"BROTH","c":"Thin soup with deep flavour","m":[7,48,22,54,14]},{"a":"RECIPE","c":"Instructions you will ignore slightly","m":[30,45,9,17,49,8]},{"a":"BAMBOO","c":"Grass tall enough to build with","m":[38,10,-1,42,2,46]},{"a":"PASTRY","c":"Butter and flour, done properly","m":[1,4,19,3,18,-1]},{"a":"ROAST","c":"Cook it slowly and let it brown","m":[37,31,41,-1,5]},{"a":"ORANGE","c":"Fruit and colour in one word","m":[23,28,0,35,-1,12]},{"a":"TON","c":"A very heavy amount","m":[40,36,33]},{"a":"TOY","c":"Plaything under the tree","m":[20,6,-1]}],"free":[27,43,53],"hide":["O","T","S","H"],"stats":{"score":163.5,"letters":55,"clues":11,"distinct":20,"hidden":4,"hideShare":0.291,"freeQuote":3,"freeAnswer":5,"vowelRatio":0.436,"commonShare":0.709,"stopShare":0.236,"pairLoad":1.17,"avgLen":5.18}},{"id":9,"band":"hard","title":"The Orchid In Your Ice Cream","art":"vanilla","quote":"Real vanilla comes from an orchid that must be pollinated by hand alone.","fact":["Real vanilla comes from an orchid that must be pollinated by hand alone. The vine is native to Mexico, where a particular local bee had quietly done the job for centuries. Move the plant anywhere else in the world and the flowers open, wait a single morning, and close again having produced nothing.","The problem was solved in 1841 by Edmond Albius, an enslaved twelve year old boy on the island of Reunion, who worked out how to lift the flap separating the male and female parts of the flower and press them together with a sliver of bamboo. His method is still the method. Every vanilla pod in the world is the result of somebody performing that gesture, flower by flower, on the one morning it is possible.","Curing then takes months of blanching, sweating and slow drying before the pods develop any of the aroma we recognise. Between the hand work and the wait, vanilla remains the second most expensive spice on earth, which is why so much of what we taste is synthetic."],"factPara":0,"factStart":0,"factEnd":72,"clues":[{"a":"GRAVITY","c":"Why nothing here floats away","m":[-1,17,2,4,26,35,49]},{"a":"CRUMB","c":"The evidence you ate it","m":[24,0,33,13,48]},{"a":"DOLPHIN","c":"It sleeps with half its brain awake","m":[53,22,40,38,50,7,21]},{"a":"CHEF","c":"The one shouting in the kitchen","m":[11,29,46,16]},{"a":"SIMMER","c":"Cook just below a boil","m":[15,42,32,19,14,23]},{"a":"BREAD","c":"The oldest thing on the table","m":[36,-1,1,30,27]},{"a":"SANDAL","c":"Footwear of the ancient world","m":[34,51,6,47,54,9]},{"a":"THRONE","c":"A chair with consequences","m":[45,25,-1,39,57,58]},{"a":"TOMATO","c":"Fruit that insists it is a vegetable","m":[31,18,-1,5,28,12]},{"a":"LLAMA","c":"Andean pack animal that spits","m":[3,41,20,-1,44]},{"a":"ALOE","c":"Plant you rub on a sunburn","m":[10,8,56,37]}],"free":[43,52,55],"hide":["A","O","R","S"],"stats":{"score":168.8,"letters":59,"clues":11,"distinct":19,"hidden":4,"hideShare":0.305,"freeQuote":3,"freeAnswer":5,"vowelRatio":0.373,"commonShare":0.644,"stopShare":0.237,"pairLoad":1.18,"avgLen":5.55}},{"id":10,"band":"hard","title":"Counted Grain By Grain","art":"pepper","quote":"Black pepper was once so valuable that traders counted the grains one by one.","fact":["Black pepper was once so valuable that traders counted the grains one by one. It arrived in Europe from the Malabar coast of India after a journey o ydrogen and helium with no solid surface to stand on.","The picture of it bobbing in a giant bath is a useful lie rather than a real possibility. There is no bath large enough, the planet would tear itself apart under its own gravity long before it settled, and the dense core at the centre is anything but light.","The rings are stranger than the planet. They stretch across a span wider than the distance from here to the moon, yet in most places they are only about ten metres thick, and they are made almost entirely of ordinary water ice."],"factPara":0,"factStart":0,"factEnd":41,"clues":[{"a":"FINGER","c":"Ten of them, and all named","m":[21,6,27,17,13,32]},{"a":"WALNUT","c":"Nut shaped like a brain","m":[28,24,22,5,3,12]},{"a":"SIGNAL","c":"What a distant probe sends home","m":[0,9,10,14,29,8]},{"a":"DUST","c":"Space is surprisingly full of it","m":[-1,16,7,2]},{"a":"HERO","c":"The one the story follows","m":[11,31,4,26]},{"a":"HAT","c":"Chefs wear a tall white one","m":[18,1,30]},{"a":"LOT","c":"An auction item, or a great deal","m":[-1,20,25]},{"a":"POT","c":"It sits on the stove all day","m":[-1,23,19]}],"free":[15],"hide":["W","F"],"stats":{"score":108.4,"letters":33,"clues":8,"distinct":14,"hidden":2,"hideShare":0.061,"freeQuote":1,"freeAnswer":3,"vowelRatio":0.394,"commonShare":0.758,"stopShare":0.182,"pairLoad":0.79,"avgLen":4.38}},{"id":3,"band":"easy","title":"The Moon Is Leaving","art":"moonaway","quote":"The moon drifts further from earth every year.","fact":["The moon drifts further from earth every year. Mirrors left on the surface by the Apollo crews let us bounce a laser off it and measure the gap to within a few centimetres, and the answer keeps growing by about three and a half centimetres every year.","Tides are the reason. The moon raises a bulge of water on the earth, our spin drags that bulge slightly ahead, and the bulge tugs the moon forward into a wider orbit. The energy has to come from somewhere, so our own day gets a fraction of a second title":"Rome Had Fast Food","art":"thermopolium","quote":"Most people in Rome ate out every day.","fact":["Most people in Rome ate out every day. Ordinary flats in the city had no hearth, because an open fire in a crowded timber and brick block was a good way to burn down the neighbourhood, so cooking happened elsewhere.","Elsewhere meant the counter on the corner. Excavations at Pompeii and Ostia turn up hundreds of little shops with masonry counters and sunken jars for hot food, selling stew, bread, cheese, olives and heavily watered wine to anyone passing.","The scale of the habit surprised the archaeologists who counted them. One street in Pompeii has a food counter every few doors, which puts ancient dining somewhere between a modern food court and a very busy pub."],"factPara":0,"factStart":0,"factEnd":38,"clues":[{"a":"VINYL","c":"Records came back on it","m":[23,10,11,26,8]},{"a":"MUMMY","c":"Wrapped for a very long journey","m":[-1,20,14,0,29]},{"a":"SPEAR","c":"Reach beating strength","m":[2,7,9,28,12]},{"a":"POD","c":"Where peas keep their siblings","m":[4,19,27]},{"a":"TREAT","c":"Something nice you did not need","m":[3,25,24,16,21]},{"a":"TOE","c":"You stub it in the dark","m":[17,1,22]},{"a":"ORE","c":"Rock worth digging up","m":[6,-1,5]},{"a":"EVE","c":"The night before the big day","m":[15,-1,18]}],"free":[13],"hide":["U","V"],"stats":{"score":104.6,"letters":30,"clues":8,"distinct":15,"hidden":2,"hideShare":0.067,"freeQuote":1,"freeAnswer":3,"vowelRatio":0.467,"commonShare":0.667,"stopShare":0.3,"pairLoad":0.7,"avgLen":4}},{"id":3,"band":"easy","title":"Steel Before Its Time","art":"sword","quote":"The chemistry only arrived much later.","fact":["Craftsmen were forging fine steel long before anyone understood the recipe. Smiths in southern India were making crucible steel by the early centuries of the common era, sealing iron and carbon rich material in a clay pot and heating it for hours.","The bars travelled enormous distances. Traded west through Persia and the Arab world, they became the blades that Europe knew as Damascus steel, admired for holding an edge and for the watery pattern in the surface.","The chemistry only arrived much later. Nobody involved could have described carbon content or crystal structure, and the method was carried instead as a craft: exact clay, exact charge, exact number of hours, passed on by being shown."],"factPara":2,"factStart":0,"factEnd":38,"clues":[{"a":"VALLEY","c":"Where the river settled","m":[20,28,14,27,5,15]},{"a":"CHERRY","c":"It tops the cake","m":[3,1,30,18,10,11]},{"a":"THRONE","c":"A chair with consequences","m":[29,4,17,12,13,2]},{"a":"ARCH","c":"Stone clever enough to hold itself up","m":[16,31,25,26]},{"a":"MUD","c":"Soil that met too much rain","m":[6,24,22]},{"a":"RIM","c":"The edge of a wheel or a glass","m":[-1,7,23]},{"a":"PIT","c":"Hole in the ground, or a peach's core","m":[-1,19,9]},{"a":"NET","c":"It catches fish and stops goals","m":[-1,21,0]}],"free":[8],"hide":["U","D"],"stats":{"score":111.2,"letters":32,"clues":8,"distinct":16,"hidden":2,"hideShare":0.063,"freeQuote":1,"freeAnswer":3,"vowelRatio":0.313,"commonShare":0.656,"stopShare":0.219,"pairLoad":0.8,"avgLen":4.25}},{"id":4,"band":"medium","title":"Older Than The Mammoth","art":"pyramid","quote":"Mammoths were alive when the pyramids were built.","fact":["Mammoths were alive when the pyramids were built. The mainland herds had gone, but a stranded population survived on Wrangel Island in the Arctic Ocean until about four thousand years ago, several centuries after the great pyramid at Giza was finished.","Isolation made them smaller and steadily less healthy. Cut off by rising seas at the end of the last ice age, the island group bred among itself for thousands of years and slowly accumulated the genetic faults that come with a tiny population.","The overlap is a useful reminder of how recent ancient history is. Written records, cities, taxes and monumental architecture all existed while a herd of mammoths was still walking around on the other side of the world."],"factPara":0,"factStart":0,"factEnd":49,"clues":[{"a":"PYRAMID","c":"A tomb with a very good angle","m":[24,25,10,27,28,29,30]},{"a":"WILLOW","c":"Tree that weeps by the water","m":[32,14,39,13,4,17]},{"a":"THUMB","c":"The one that made tools possible","m":[5,6,37,0,36]},{"a":"WOVEN","c":"Made on a loom","m":[8,-1,15,23,20]},{"a":"HAMMER","c":"It only understands nails","m":[22,12,3,2,16,26]},{"a":"TRIBE","c":"A group bound by kinship","m":[40,34,38,-1,19]},{"a":"HAT","c":"Chefs wear a tall white one","m":[18,1,21]},{"a":"SEA","c":"Salt water with a horizon","m":[7,9,-1]},{"a":"BEE","c":"Tiny worker behind every honey jar","m":[-1,35,11]}],"free":[31,33],"hide":["W","L","T"],"stats":{"score":134.4,"letters":41,"clues":9,"distinct":18,"hidden":3,"hideShare":0.195,"freeQuote":2,"freeAnswer":4,"vowelRatio":0.366,"commonShare":0.634,"stopShare":0.268,"pairLoad":1.08,"avgLen":4.78}},{"id":5,"band":"medium","title":"Paid In Bread And Beer","art":"beer","quote":"The workers who built the pyramids were paid in bread and beer.","fact":["The workers who built the pyramids were paid in bread and beer. Records from the workers' villages list rations by the loaf and the jug, and the beer was thick, mildly alcoholic and nourishing enough to count as food rather than a treat.","They were not slaves. The camps beside the pyramids have bakeries, breweries, hospitals with mended bones and a cemetery of ordinary graves, all of which describe a large paid workforce rotating through in organised gangs.","The gangs even had names. Graffiti left inside the monuments records teams calling themselves things like the friends of Khufu, scrawled where nobody was ever supposed to look again."],"factPara":0,"factStart":0,"factEnd":63,"clues":[{"a":"PAPYRUS","c":"Reed that carried the first writing","m":[21,44,33,22,23,14,9]},{"a":"WHISK","c":"It beats eggs into submission","m":[10,1,26,28,6]},{"a":"WOMBAT","c":"Its burrow function artSvg(name) {
