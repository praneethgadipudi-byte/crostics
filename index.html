<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crostics</title>
<style>
/* ==========================================================================
   palette and frame
   ========================================================================== */
:root{
  --bg:#FFF7EF;
  --page:#F0E4D6;
  --card:#FFFFFF;
  --ink:#3B2F2A;
  --ink-soft:#7B6A60;
  --muted:#B6A79C;
  --line:#EFE2D5;

  --primary:#FF8A3D;
  --primary-dk:#EE7222;
  --primary-sh:#C85A12;
  --accent:#31BFA3;
  --accent-dk:#22A78D;
  --good:#3FBE80;
  --good-bg:#E4F7ED;
  --bad:#FF5F5F;
  --bad-bg:#FFE9E9;
  --gold:#FFB020;

  --cell:#FBEFE1;
  --cell-line:#EBD9C4;
  --cell-peer:#FFEBD2;
  --cell-link:#FFD9AE;

  --r-s:10px;
  --r-m:16px;
  --r-l:22px;
  --shadow:0 2px 0 rgba(59,47,42,.06), 0 8px 24px rgba(59,47,42,.07);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden}
body{
  margin:0;
  background:
    radial-gradient(1000px 600px at 50% -10%, #FFE9D2 0%, transparent 60%),
    var(--page);
  font-family:"Nunito","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
#app{
  width:100%; max-width:440px; height:100dvh; max-height:940px;
  background:var(--bg);
  display:flex; flex-direction:column;
  position:relative; overflow:hidden;
  box-shadow:0 30px 80px rgba(59,47,42,.22);
}
@media (min-width:520px) and (min-height:800px){
  #app{border-radius:28px; height:min(94dvh,940px)}
}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
::selection{background:var(--cell-link)}

/* ==========================================================================
   shared bits
   ========================================================================== */
.screen{display:flex;flex-direction:column;flex:1;min-height:0;animation:screenIn .28s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.banner{
  flex:none;height:56px;margin:0 12px 10px;border-radius:var(--r-s);
  border:1.5px dashed var(--cell-line);background:#FDF3E8;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.14em;
}

.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;
}
.pill.easy{background:#E4F7ED;color:#279C67}
.pill.medium{background:#FFF1D9;color:#C88914}
.pill.hard{background:#FFE6E6;color:#D9534F}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card);border:1.5px solid var(--line);
  padding:6px 12px;border-radius:999px;font-weight:900;font-size:14px;
  box-shadow:0 2px 0 rgba(59,47,42,.05);
}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--r-m);font-weight:900;letter-spacing:.02em;
  padding:15px 18px;transition:transform .08s ease, filter .15s ease;
}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-sh)}
.btn.primary:active{box-shadow:0 2px 0 var(--primary-sh)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 rgba(59,47,42,.06)}
.btn.mint{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-dk)}
.btn.mint:active{box-shadow:0 2px 0 var(--accent-dk)}
.btn[disabled]{opacity:.45;pointer-events:none}

.scrollbox{position:relative;flex:1;min-height:0;display:flex}
.scrollinner{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-right:12px}
.scrollinner::-webkit-scrollbar{display:none}
.rail{
  position:absolute;right:3px;top:6px;bottom:6px;width:5px;
  border-radius:3px;background:#F1E4D6;
}
.rail .thumb{
  position:absolute;left:0;width:5px;border-radius:3px;
  background:var(--cell-link);transition:opacity .3s ease;
}

/* ==========================================================================
   home
   ========================================================================== */
.homeHead{padding:22px 20px 14px}
.homeHead h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.02em}
.homeHead p{margin:5px 0 0;color:var(--ink-soft);font-size:14px;font-weight:600}
.homeStats{display:flex;gap:8px;margin-top:14px}

.cardGrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:4px 20px 18px}
.pcard{
  background:var(--card);border-radius:var(--r-m);padding:13px;
  border:2px solid var(--line);box-shadow:var(--shadow);
  text-align:left;display:flex;flex-direction:column;gap:8px;
  min-height:132px;position:relative;overflow:hidden;
  transition:transform .1s ease;
}
.pcard:active{transform:scale(.97)}
.pcard .art{height:44px;display:flex;align-items:center}
.pcard .art svg{height:44px;width:auto}
.pcard .no{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.1em}
.pcard .nm{font-size:14px;font-weight:900;line-height:1.2}
.pcard .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.pcard.done{border-color:#CFEEDD;background:linear-gradient(180deg,#F6FFFA,#fff)}
.tick{width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:900}
.pcard.locked{opacity:.5;pointer-events:none}
.resume{font-size:11px;font-weight:900;color:var(--primary)}
.pcard.soon{opacity:.62;background:#FDF6EE;border-style:dashed;cursor:default}
.pcard.soon .nm{color:var(--muted)}
.soonIcon{font-size:26px;opacity:.5}

/* theme tabs: five packs of ten, one row above the banner */
.tabbar{
  flex:none;display:flex;gap:5px;padding:8px 12px 10px;margin:0 2px;
  border-top:2px solid var(--line);background:var(--bg);
}
.tab{
  flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px 6px;border-radius:14px;border:2px solid transparent;
  transition:background .15s ease, border-color .15s ease;
}
.tab .te{font-size:19px;line-height:1;filter:grayscale(.55) opacity(.7)}
.tab .tn{font-size:9.5px;font-weight:900;letter-spacing:.04em;color:var(--muted)}
.tab.on{background:#FFF3E6;border-color:#FFD9AE}
.tab.on .te{filter:none}
.tab.on .tn{color:var(--primary-dk)}
.tab:active{transform:translateY(1px)}
/* marks a theme that has no puzzles yet */
.tab .tdot{
  position:absolute;top:5px;right:calc(50% - 17px);
  width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.55;
}

/* ==========================================================================
   intro overlay, sitting over a dimmed view of the board it is about to open
   ========================================================================== */
.introVeil{
  position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(52,37,30,.84),rgba(34,23,18,.95));
  animation:fade .22s ease both;
}
.introHead{flex:none;padding:14px 16px 0}
.introHead .iconbtn{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.introMain{
  flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:13px;padding:4px 24px 12px;text-align:center;color:#fff;
}
.introKicker{font-size:11px;font-weight:900;letter-spacing:.16em;color:rgba(255,255,255,.6)}
.introTitle{margin:0;font-size:29px;font-weight:900;line-height:1.1;letter-spacing:-.02em}

/* the streak carries the most weight after the title */
.introStreak{
  display:flex;align-items:center;gap:10px;padding:9px 18px 9px 13px;border-radius:999px;
  background:rgba(255,138,61,.2);border:1.5px solid rgba(255,168,110,.5);
}
.introStreak .f{font-size:22px;line-height:1}
.introStreak .n{font-size:28px;font-weight:900;color:#FFB27A;line-height:1}
.introStreak .l{font-size:9px;font-weight:900;letter-spacing:.11em;
  color:rgba(255,255,255,.72);text-align:left;line-height:1.2}
.introProof{font-size:12px;font-weight:800;color:#9BE6BE;line-height:1.35;max-width:280px}

/* the powerup, off by default: turning it on costs an ad watch */
.powerSquare{
  width:172px;aspect-ratio:1;flex:none;
  background:var(--card);border:2px solid var(--line);border-radius:24px;
  box-shadow:0 14px 34px rgba(0,0,0,.34);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:border-color .18s ease, background .18s ease;
}
.powerSquare.on{border-color:var(--primary);background:#FFFBF6}
.powerSquare .psBadge{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:#F3E7DA;color:var(--muted);font-size:11px;font-weight:900;
  transition:background .18s ease, color .18s ease;
}
.powerSquare.on .psBadge{background:var(--primary);color:#fff}
.powerSquare .psTitle{font-size:15.5px;font-weight:900;color:var(--ink)}
.powerSquare .psWatch{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.sw{
  position:relative;flex:none;width:74px;height:30px;border-radius:999px;
  background:#EFE2D5;border:2px solid var(--line);margin-top:2px;
  transition:background .18s ease, border-color .18s ease;
}
.sw i{
  position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(59,47,42,.28);
  transition:transform .18s cubic-bezier(.2,1.2,.4,1);
}
.sw span{
  position:absolute;top:0;bottom:0;right:9px;display:flex;align-items:center;
  font-size:9.5px;font-weight:900;letter-spacing:.06em;color:var(--muted);
  transition:color .18s ease;
}
.powerSquare.on .sw{background:var(--primary);border-color:var(--primary)}
.powerSquare.on .sw i{transform:translateX(44px)}
.powerSquare.on .sw span{right:auto;left:10px;color:#fff}
.introBenefit{font-size:12.5px;font-weight:800;color:#9BE6BE;line-height:1.4;max-width:290px}
.introPlay{width:100%;max-width:320px;margin-top:2px;font-size:17px}
.introVeil .banner{
  border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.07);
  color:rgba(255,255,255,.62);
}

/* ==========================================================================
   puzzle screen
   ========================================================================== */
.topbar{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:14px 14px 10px;
}
.iconbtn{
  width:38px;height:38px;border-radius:12px;background:var(--card);
  border:2px solid var(--line);display:grid;place-items:center;
  box-shadow:0 2px 0 rgba(59,47,42,.06);flex:none;
}
.iconbtn:active{transform:translateY(1px)}
.topbar .titles{flex:1;min-width:0}
.topbar .t1{font-size:15px;font-weight:900;line-height:1.1}
.topbar .t2{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-top:2px}

.lives{display:flex;gap:5px;flex:none}
/* an empty box per life, stamped with a cross left to right as they are spent */
.life{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  background:transparent;border:2px solid var(--line);position:relative;
  transition:transform .2s ease, background .2s ease, border-color .2s ease}
.life svg{width:13px;height:13px;stroke:var(--bad);stroke-width:3;stroke-linecap:round;
  opacity:0;transform:scale(.3);transition:opacity .18s ease, transform .18s ease}
.life.spent{background:var(--bad-bg);border-color:#F3AFAF}
.life.spent svg{opacity:1;transform:scale(1)}
.life.pop{animation:lifePop .45s ease}
@keyframes lifePop{0%{transform:scale(1)}35%{transform:scale(1.45)}100%{transform:scale(1)}}

/* losing a strike has to be impossible to miss, so four cues fire at once: the
   board flashes red at the edges, the row of boxes flinches, the box just
   stamped throws off a -1, and a line of copy names what it cost */
.lives.hit{animation:livesHit .44s ease}
@keyframes livesHit{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-3px) scale(1.08)}
  60%{transform:translateX(3px) scale(1.08)}
}
.minus{
  position:absolute;left:50%;top:-2px;pointer-events:none;
  font-size:12.5px;font-weight:900;color:var(--bad);
  animation:minusUp .8s ease-out both;
}
@keyframes minusUp{
  0%{opacity:0;transform:translate(-50%,4px) scale(.7)}
  25%{opacity:1;transform:translate(-50%,-11px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-27px) scale(1)}
}
.strikeFlash{
  position:absolute;inset:0;z-index:44;pointer-events:none;
  box-shadow:inset 0 0 0 4px rgba(255,95,95,.85), inset 0 0 70px 26px rgba(255,95,95,.3);
  animation:strikeFlash .52s ease both;
}
@keyframes strikeFlash{0%{opacity:0}16%{opacity:1}100%{opacity:0}}
.strikeMsg{
  position:absolute;left:50%;top:56px;z-index:45;pointer-events:none;white-space:nowrap;
  background:var(--bad);color:#fff;padding:9px 17px;border-radius:999px;
  font-size:13.5px;font-weight:900;box-shadow:0 8px 20px rgba(255,95,95,.42);
  animation:strikeMsg 1.5s ease both;
}
.strikeMsg.final{background:#D93A3A}
@keyframes strikeMsg{
  0%{opacity:0;transform:translate(-50%,-9px) scale(.9)}
  12%{opacity:1;transform:translate(-50%,0) scale(1)}
  76%{opacity:1;transform:translate(-50%,0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-6px) scale(1)}
}

.quoteCard{
  flex:none;margin:2px 14px 12px;padding:14px 12px;
  background:var(--card);border:2px solid var(--line);
  border-radius:var(--r-l);box-shadow:var(--shadow);
}
/* finishing the quote is the middle milestone, so the card itself reacts */
.quoteCard.done{
  border-color:var(--good);
  box-shadow:0 0 0 4px rgba(63,190,128,.22), var(--shadow);
  animation:cardGlow 1.4s ease both;
}
@keyframes cardGlow{0%{transform:scale(1)}18%{transform:scale(1.025)}100%{transform:scale(1)}}
.quoteGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 0}
.qword{display:flex;gap:3px;margin:0 5px}
.qpunc{align-self:flex-end;font-weight:900;font-size:15px;color:var(--ink-soft);padding-bottom:3px}

.cell{
  width:var(--cw);height:calc(var(--cw) * 1.34);
  border-radius:6px;background:var(--cell);
  border:1.5px solid var(--cell-line);
  display:grid;place-items:center;position:relative;
  font-weight:900;font-size:var(--cf);line-height:1;
  color:var(--ink);cursor:pointer;
  transition:background .15s ease, border-color .15s ease, transform .1s ease;
}
/* the letter sits below the index strip rather than fighting it for the centre */
.cell b{display:block;padding-top:calc(var(--ixf) * 0.9)}
.cell .ix{
  position:absolute;top:1px;left:0;right:0;text-align:center;
  font-size:var(--ixf);font-weight:800;line-height:1;
  color:var(--muted);letter-spacing:0;
}
.cell.free{border-style:dashed;border-color:#D9C7B2;background:#FFFBF5}
/* every other cell of the selected letter, in the quote and in the clue list.
   It has to carry real contrast, because it is the only thing showing where a
   letter goes when auto-fill is off. */
.cell.peer{background:var(--cell-link);border-color:#E9A055;border-width:2px}
.cell.peer .ix{color:#B4661C}
.cell.sel{border-color:var(--primary);border-width:2.5px;background:#fff;
  box-shadow:0 0 0 3px rgba(255,138,61,.18)}
.cell.wrong{background:var(--bad-bg);border-color:#F3AFAF;color:var(--bad)}
/* solved letters carry the strongest fill on the board so progress is obvious
   at a glance, and they outrank the peer tint that would dilute it */
.cell.lock{
  background:#BDEDD2;border:2px solid var(--good);
  color:#15734A;cursor:default;
}
.cell.lock .ix{color:#2F9C68}
/* a solved cell still has to show that it belongs to the letter being pointed
   at, so it keeps the green fill and takes the amber ring on top */
.cell.lock.peer,
.cell.lock.sel{
  border-color:#E9A055;border-width:2.5px;
  box-shadow:0 0 0 3px rgba(233,160,85,.36);
}
.cell.lock.peer .ix,
.cell.lock.sel .ix{color:#B4661C}
/* an unindexed cell keeps its dashed edge even once solved */
.cell.lock.free{border-style:dashed}
.cell.pop{animation:cellPop .3s ease}
@keyframes cellPop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.cell.shake{animation:shake .32s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* clue list */
.clueWrap{position:relative;flex:1;min-height:0;margin:0 14px;display:flex}
.clueScroll{
  flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;
  padding:2px 14px 72px 0;
}
.clueScroll::-webkit-scrollbar{display:none}

.clueRow{
  display:flex;gap:10px;align-items:center;
  padding:9px 10px;border-radius:var(--r-m);margin-bottom:7px;
  background:var(--card);border:2px solid transparent;position:relative;
  transition:border-color .15s ease, background .15s ease;
}
/* the smallest of the three rewards: a green sweep across the row that just
   came out, enough to notice without interrupting the next guess */
.clueRow.justSolved{animation:rowNudge .5s ease}
@keyframes rowNudge{0%,100%{transform:scale(1)}40%{transform:scale(1.02)}}
.clueRow.justSolved::after{
  content:"";position:absolute;inset:0;border-radius:var(--r-m);pointer-events:none;
  background:linear-gradient(100deg,transparent 22%,rgba(63,190,128,.36) 50%,transparent 78%);
  background-size:240% 100%;animation:rowSweep .7s ease-out both;
}
@keyframes rowSweep{from{background-position:130% 0}to{background-position:-130% 0}}
.clueRow.justSolved .lbl{animation:lblPop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes lblPop{0%{transform:scale(1)}45%{transform:scale(1.38)}100%{transform:scale(1)}}
.clueRow.stack{flex-direction:column;align-items:stretch;gap:7px}
.clueRow.active{border-color:#FFD9AE;background:#FFFDF9}
.clueRow.solved{background:#F7FCF9}
.clueRow .lbl{
  flex:none;width:22px;height:22px;border-radius:7px;background:#F3E7DA;
  display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--ink-soft);
}
.clueRow.solved .lbl{background:var(--good);color:#fff}
.clueHead{display:flex;gap:9px;align-items:flex-start;flex:1;min-width:0}
.clueRow .txt{font-size:13.5px;font-weight:700;line-height:1.32;color:var(--ink)}
.clueRow.solved .txt{color:var(--ink-soft)}
.ansCells{display:flex;gap:3px;flex-wrap:wrap;flex:none}
.clueRow.stack .ansCells{padding-left:31px}
.ansCells .cell{--cw:26px;--cf:14px;--ixf:8px}

.hintBtn{
  position:absolute;right:14px;bottom:12px;z-index:3;
  display:flex;align-items:center;gap:7px;
  background:var(--card);border:2px solid var(--line);
  padding:10px 15px;border-radius:999px;font-weight:900;font-size:14px;
  box-shadow:0 4px 14px rgba(59,47,42,.14);
}
.hintBtn:active{transform:translateY(2px)}
.hintBtn.empty{color:var(--muted)}

/* keyboard */
.kb{flex:none;padding:8px 6px 6px;display:flex;flex-direction:column;gap:6px}
.krow{display:flex;gap:5px;justify-content:center}
.key{
  flex:1;max-width:38px;height:44px;border-radius:9px;
  background:var(--card);box-shadow:0 2px 0 #E3D4C4;
  display:grid;place-items:center;font-weight:900;font-size:16px;
}
.key:active{transform:translateY(2px);box-shadow:0 0 0 #E3D4C4}
.key.wide{max-width:56px;background:#F3E7DA}

/* ==========================================================================
   overlays
   ========================================================================== */
.veil{
  position:absolute;inset:0;z-index:50;
  background:rgba(59,47,42,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;
  animation:fade .2s ease both;
}
@keyframes fade{from{opacity:0}to{opacity:1}}

.sheet{
  width:100%;background:var(--card);border-radius:26px;padding:24px 20px 20px;
  position:relative;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);
  animation:sheetIn .3s cubic-bezier(.2,1.2,.4,1) both;
}
@keyframes sheetIn{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}
.sheet h2{margin:0 0 6px;font-size:22px;font-weight:900}
.sheet p{margin:0 0 16px;color:var(--ink-soft);font-size:14px;font-weight:600;line-height:1.4}
.closeX{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;
  background:#F3E7DA;display:grid;place-items:center;font-weight:900;color:var(--ink-soft)}
.streakBox{
  background:#FFF6E8;border:2px solid #FFE3BE;border-radius:var(--r-m);
  padding:12px;margin-bottom:16px;
}
.streakBox .n{font-size:30px;font-weight:900;color:var(--primary)}
.streakBox .l{font-size:11.5px;font-weight:900;color:#C88914;letter-spacing:.1em}
.sheet .btn{width:100%;margin-top:9px}
.costTag{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.25);
  padding:3px 9px;border-radius:999px;font-size:13px}

.adFull{
  position:absolute;inset:0;z-index:80;background:#221B17;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.adFull .tag{font-size:11px;font-weight:900;letter-spacing:.3em;color:#8C7A6C}
.adFull .big{font-size:26px;font-weight:900;letter-spacing:.02em}
.adBar{width:150px;height:5px;border-radius:3px;background:#3A2F28;overflow:hidden}
.adBar i{display:block;height:100%;background:var(--primary);width:0;animation:adGo 2s linear forwards}
@keyframes adGo{to{width:100%}}

.cheer{
  position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;pointer-events:none;
  background:rgba(255,247,239,.72);
}
.cheer .big{font-size:38px;font-weight:900;color:var(--primary);
  animation:cheerIn .5s cubic-bezier(.2,1.4,.4,1) both}
.cheer .sub{font-size:15px;font-weight:800;color:var(--ink-soft);
  animation:cheerIn .5s .12s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cheerIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#confetti{position:absolute;inset:0;z-index:71;pointer-events:none}
/* the quote celebration paints over the board rather than over the app */
.fx{position:absolute;inset:0;z-index:46;pointer-events:none}
.midCheer{
  position:absolute;left:50%;top:34%;z-index:47;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:rgba(63,190,128,.96);color:#fff;padding:12px 22px;border-radius:18px;
  box-shadow:0 12px 30px rgba(47,156,104,.42);animation:midCheer 1.5s ease both;
}
.midCheer b{font-size:16px;font-weight:900;letter-spacing:.06em}
.midCheer span{font-size:12px;font-weight:800;opacity:.92}
@keyframes midCheer{
  0%{opacity:0;transform:translate(-50%,-40%) scale(.8)}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  78%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-58%) scale(1)}
}

.toast{
  position:absolute;left:50%;bottom:112px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;
  font-size:13px;font-weight:800;z-index:60;animation:toastIn 2s ease both;
}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,8px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ==========================================================================
   streak screen
   ========================================================================== */
.streakScreen{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:22px;text-align:center;gap:4px}
.flame{font-size:62px;animation:flameIn .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes flameIn{from{opacity:0;transform:scale(.4) rotate(-14deg)}to{opacity:1;transform:none}}
.streakN{font-size:58px;font-weight:900;line-height:1;color:var(--primary)}
.streakL{font-size:13px;font-weight:900;letter-spacing:.16em;color:var(--ink-soft)}
/* the wording has to say wins, not days, or the run reads like a calendar */
.streakNote{margin-top:6px;max-width:300px;font-size:12.5px;font-weight:700;
  line-height:1.4;color:var(--ink-soft)}
.streakStats{display:flex;gap:10px;margin-top:16px;width:100%;max-width:320px}
.sbox{
  flex:1;position:relative;background:var(--card);border:2px solid var(--line);
  border-radius:var(--r-m);padding:11px 8px;box-shadow:0 2px 0 rgba(59,47,42,.05);
}
.sbox.on{border-color:#FFD9AE;background:#FFFBF5}
.sbox .n{font-size:24px;font-weight:900;line-height:1.1;color:var(--ink)}
.sbox .l{margin-top:3px;font-size:9.5px;font-weight:900;letter-spacing:.11em;color:var(--muted)}
.sbox .tagNew{
  position:absolute;top:-8px;right:-6px;background:var(--primary);color:#fff;
  font-size:9px;font-weight:900;letter-spacing:.08em;padding:3px 7px;border-radius:999px;
}
.streakProof{margin-top:12px;max-width:300px;font-size:12.5px;font-weight:800;
  line-height:1.4;color:#279C67}
.progWrap{width:100%;margin-top:22px;max-width:320px}
.progTop{display:flex;justify-content:space-between;font-size:12px;font-weight:900;
  color:var(--ink-soft);margin-bottom:7px}
.progBar{height:16px;border-radius:999px;background:#F1E2D2;overflow:hidden;position:relative}
.progBar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#FFB020,var(--primary));width:0;
  transition:width .9s cubic-bezier(.3,1,.4,1)}
.pips{display:flex;justify-content:space-between;margin-top:8px}
.pip{width:13px;height:13px;border-radius:50%;background:#EBDCCB}
.pip.on{background:var(--primary)}
.pip.goal{width:22px;height:22px;margin-top:-5px;background:#FFF;border:2.5px solid #EBDCCB;
  display:grid;place-items:center;font-size:10px}
.pip.goal.on{border-color:var(--gold);background:#FFF6E4}
.tapOn{
  margin-top:24px;font-size:11px;font-weight:900;letter-spacing:.22em;
  color:var(--muted);animation:blink 1.8s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.rewardCard{
  margin-top:16px;background:#FFF6E8;border:2px solid #FFE3BE;border-radius:var(--r-m);
  padding:14px 18px;font-weight:900;color:#C88914;font-size:14px;
  animation:sheetIn .5s .5s both;
}

/* ==========================================================================
   review screen
   ========================================================================== */
.reviewArt{
  flex:none;margin:12px 14px 0;height:132px;border-radius:var(--r-l);
  background:linear-gradient(160deg,#FFE7CC,#FFF4E6);
  border:2px solid var(--line);display:grid;place-items:center;overflow:hidden;
}
.reviewArt svg{height:104px;width:auto}
.reviewHead{padding:14px 20px 8px}
.reviewHead h2{margin:0;font-size:21px;font-weight:900;letter-spacing:-.01em}
.reviewBody{margin:0 14px;flex:1;min-height:0;display:flex;position:relative}
.reviewBody .scrollinner{padding:0 16px 8px 6px}
.reviewBody p{margin:0 0 13px;font-size:14px;line-height:1.6;font-weight:600;color:#4E403A}
.reviewBody mark{
  background:linear-gradient(180deg,transparent 52%,#FFDFAE 52%);
  color:var(--ink);font-weight:800;padding:0 1px;border-radius:2px;
}
.recap{display:flex;flex-direction:column;gap:8px;padding-right:4px}
.recapRow{display:flex;gap:10px;align-items:baseline;background:var(--card);
  border:2px solid var(--line);border-radius:var(--r-s);padding:10px 12px}
.recapRow .w{font-weight:900;font-size:13px;color:var(--primary-dk);
  letter-spacing:.06em;flex:none;min-width:74px}
.recapRow .c{font-size:13px;font-weight:600;color:var(--ink-soft);line-height:1.35}
.reviewCtas{flex:none;padding:10px 16px 4px;display:flex;flex-direction:column;gap:9px}
</style>
</head>

const PACK = {"pack":{"id":"food-origins","name":"Food Origins","blurb":"Ten true stories about where dinner came from."},"puzzles":[{"id":1,"band":"easy","title":"The Purple Carrot","art":"carrot","quote":"Wild carrots were purple, not orange.","fact":["Long before the carrot became the tidy orange stick in your fridge, it grew across Persia and Afghanistan as a thin, forked, strong smelling root. Wild carrots were purple, not orange. Farmers of the time valued the plant as much for its aromatic seeds and feathery leaves as for anything underground.","The orange carrot is a surprisingly modern invention. Dutch growers in the sixteenth and seventeenth centuries kept selecting for a fatter, sweeter, less woody root, and the colour that came along for the ride was beta carotene. The vegetable we now treat as the definition of healthy eating is essentially a bred product of a few hundred years of patient gardening.","Purple carrots never actually vanished. They stayed in kitchens across Turkey, Iran and India, and they have quietly returned to European markets in the last twenty years, sold at a premium as something exotic and new."],"factPara":0,"factStart":147,"factEnd":184,"clues":[{"a":"WILLOW","c":"Tree that weeps by the water","m":[0,1,2,19,8,11]},{"a":"CURD","c":"The lumpy start of every cheese","m":[4,16,13,3]},{"a":"TOAST","c":"Bread that met the fire again","m":[23,24,5,10,9]},{"a":"GAP","c":"The space that should not be there","m":[28,26,15]},{"a":"PEN","c":"Enclosure for pigs, or a writing tool","m":[18,29,21]},{"a":"URN","c":"Tall vessel for ashes or tea","m":[-1,17,27]},{"a":"ORE","c":"Rock worth digging up","m":[22,7,14]},{"a":"EAR","c":"Corn grows in one, and you listen with one","m":[20,-1,6]}],"free":[12,25],"stats":{"score":88.8,"letters":30,"clues":8,"freeQuote":2,"freeAnswer":2,"entropy":3.695,"vowelRatio":0.367,"avgLen":3.75}},{"id":2,"band":"easy","title":"Chocolate Currency","art":"cacao","quote":"Cacao beans were once used as actual money.","fact":["Cacao beans were once used as actual money. Across the Maya and later the Aztec world, prices were quoted in beans the way we quote them in coins. A turkey might cost a hundred beans, a ripe avocado around three, and a day of a labourer's work perhaps the same again.","Anything valuable enough to spend is valuable enough to fake. Archaeologists have found hollow cacao husks carefully repacked with clay and mud, which is about the oldest counterfeiting scheme we have physical evidence for. Merchants learned to weigh and rattle their beans before agreeing to a deal.","The drink those beans became would be almost unrecognisable today. It was unsweetened, poured from height to raise a thick foam, and often spiked with chilli, vanilla or annatto. Sugar only entered the story much later, in Europe."],"factPara":0,"factStart":0,"factEnd":43,"clues":[{"a":"YELLOW","c":"Colour of butter and lemons","m":[34,20,-1,29,14,10]},{"a":"CRUMB","c":"The evidence you ate it","m":[2,12,18,30,5]},{"a":"SAUCE","c":"It rescues a dull dish","m":[23,22,27,16,11]},{"a":"SCONE","c":"It divides a nation over pronunciation","m":[19,0,31,15,17]},{"a":"OATS","c":"Breakfast grain that thickens","m":[4,1,26,9]},{"a":"CANE","c":"Sugar grows on it","m":[25,7,8,33]},{"a":"DEN","c":"A fox's home, or a cosy back room","m":[21,6,32]},{"a":"TEA","c":"Leaves that started a revolution","m":[-1,13,24]}],"free":[3,28],"stats":{"score":95.8,"letters":35,"clues":8,"freeQuote":2,"freeAnswer":2,"entropy":3.55,"vowelRatio":0.486,"avgLen":4.38}},{"id":3,"band":"easy","title":"The Jar That Never Spoiled","art":"honey","quote":"Honey sealed in ancient tombs is still edible.","fact":["Honey sealed in ancient tombs is still edible. Excavators working in Egypt have opened pots left undisturbed for thousands of years and found the contents unspoiled, thick and golden, needing nothing more than a gentle warming to pour again.","The reason is chemistry rather than magic. Honey holds very little free water, which leaves nothing for bacteria to live on, and it is naturally acidic. Bees also add an enzyme that slowly releases tiny amounts of hydrogen peroxide. Between them, those three defences make an environment almost nothing can grow in.","The one thing that will ruin a jar is moisture. Left open in a damp kitchen, honey absorbs water from the air and can finally ferment, which is exactly how mead was discovered."],"factPara":0,"factStart":0,"factEnd":46,"clues":[{"a":"THYME","c":"Small leaves, big in a stew","m":[28,0,4,22,6]},{"a":"RIBBON","c":"It ties the parcel","m":[-1,29,23,35,21,14]},{"a":"ISLAND","c":"Land with water all around","m":[34,26,31,13,18,33]},{"a":"LENTIL","c":"Tiny pulse that thickens a stew","m":[8,3,2,20,11,36]},{"a":"CIDER","c":"Apples, pressed and left alone","m":[15,25,10,9,-1]},{"a":"NEST","c":"Twigs arranged into a home","m":[12,32,27,19]},{"a":"OIL","c":"It shimmers on top of water","m":[1,16,30]},{"a":"SEA","c":"Salt water with a horizon","m":[5,37,7]}],"free":[17,24],"stats":{"score":100.9,"letters":38,"clues":8,"freeQuote":2,"freeAnswer":2,"entropy":3.567,"vowelRatio":0.395,"avgLen":4.75}},{"id":4,"band":"medium","title":"The Poison Apple","art":"tomato","quote":"Europeans once feared the tomato as deadly poison.","fact":["Europeans once feared the tomato as deadly poison. When Spanish ships carried it back from the Americas in the sixteenth century, botanists took one look at the plant and recognised the family. It was an obvious relative of deadly nightshade, so for well over a century the tomato was grown as an ornamental curiosity and kept firmly out of the kitchen.","There was also a genuine reason people fell ill. Wealthy households ate from pewter plates with a high lead content, and the acid in a tomato pulled that lead straight out into the food. The poor, eating from wood and clay, ate tomatoes happily and suffered nothing at all.","Naples eventually settled the argument. Poor southern Italian cooks put the fruit on flatbread because it was cheap and it kept well, and the dish they invented travelled the world under the name pizza."],"factPara":0,"factStart":0,"factEnd":50,"clues":[{"a":"CHERRY","c":"It tops the cake","m":[11,20,21,16,2,35]},{"a":"PUMPKIN","c":"Orange squash with a carved face","m":[36,1,24,4,-1,38,41]},{"a":"FEAST","c":"Dinner that got out of hand","m":[13,14,28,29,22]},{"a":"SALAD","c":"Raw vegetables making an effort","m":[39,15,34,32,18]},{"a":"SEED","c":"The whole plant, packed small","m":[8,12,0,30]},{"a":"ONION","c":"It makes you cry while helping","m":[27,10,-1,3,7]},{"a":"TOAD","c":"Warty relative of the frog","m":[26,23,25,33]},{"a":"TOE","c":"You stub it in the dark","m":[19,40,5]},{"a":"OAR","c":"You row with a pair of them","m":[9,6,-1]}],"free":[17,31,37],"stats":{"score":113.9,"letters":42,"clues":9,"freeQuote":3,"freeAnswer":3,"entropy":3.731,"vowelRatio":0.476,"avgLen":4.67}},{"id":5,"band":"medium","title":"Two Years For One Fruit","art":"pineapple","quote":"One pineapple plant can take nearly two years to ripen.","fact":["One pineapple plant can take nearly two years to ripen. It is a slow, spiky, unglamorous crop that produces a single fruit at the centre of a rosette of tough leaves, and once it has done so the parent plant is finished.","That slowness explains why the pineapple became a symbol of outrageous wealth in eighteenth century Europe. Growing one in a cold climate meant building a heated glasshouse and paying a gardener to nurse it for two years. A single fruit could cost the equivalent of a small house, so hosts displayed them rather than ate them, and there was a brisk trade in renting a pineapple for the evening.","There is a further oddity in the fruit itself. What looks like one pineapple is actually dozens of separate flowers that fused as they grew, which is why the skin is patterned in those tessellated hexagons."],"factPara":0,"factStart":0,"factEnd":55,"clues":[{"a":"PASTRY","c":"Butter and flour, done properly","m":[42,26,37,30,27,29]},{"a":"PICKLE","c":"Vegetable saved by vinegar","m":[3,4,17,22,13,25]},{"a":"PANTRY","c":"Cupboard the cook trusts","m":[12,35,44,38,40,33]},{"a":"WINTER","c":"When the pantry earns its keep","m":[31,41,19,20,11,36]},{"a":"POTATO","c":"Root that became chips, crisps and mash","m":[8,32,-1,18,16,39]},{"a":"PECAN","c":"Nut at the heart of a pie","m":[9,6,-1,7,15]},{"a":"NEON","c":"Gas that made signs glow","m":[24,34,0,5]},{"a":"VAN","c":"Delivery vehicle with no windows","m":[-1,14,1]},{"a":"EEL","c":"Long swimmer often mistaken for a snake","m":[2,23,10]}],"free":[21,28,43],"stats":{"score":118.4,"letters":45,"clues":9,"freeQuote":3,"freeAnswer":3,"entropy":3.524,"vowelRatio":0.4,"avgLen":5}},{"id":6,"band":"medium","title":"Berry Confusion","art":"banana","quote":"To a botanist the banana is a berry and the strawberry is not.","fact":["To a botanist the banana is a berry and the strawberry is not. A berry has a strict definition: it grows from a single flower with one ovary, and it carries its seeds inside the flesh. Bananas, grapes, tomatoes and even cucumbers all pass that test comfortably.","A strawberry fails on every count. What you eat is a swollen flower base rather than an ovary, and the real fruits are the tiny specks on the outside, each one a separate seed carrier. The proper term is an aggregate accessory fruit, which is not something anyone wants printed on a jam label.","The banana plant is misfiled too. It is not a tree but the largest herb on earth, with a false trunk made of tightly wrapped leaf bases. Nearly every banana sold for export is a clone of a single variety, which is why one determined fungus can threaten the entire trade."],"factPara":0,"factStart":0,"factEnd":62,"clues":[{"a":"DAIRY","c":"Where milk becomes everything else","m":[30,17,20,26,27]},{"a":"HONEY","c":"The only food that never spoils","m":[32,47,29,13,43]},{"a":"WHISK","c":"It beats eggs into submission","m":[38,12,44,34,-1]},{"a":"RABBIT","c":"It gets into the vegetable patch","m":[25,22,39,3,8,10]},{"a":"BUTTER","c":"Cream that got churned","m":[14,-1,5,31,40,36]},{"a":"BEAN","c":"It can be baked, roasted or ground","m":[23,33,2,18]},{"a":"ROAST","c":"Cook it slowly and let it brown","m":[41,4,19,9,0]},{"a":"TASTE","c":"Only five of them, officially","m":[11,28,21,35,24]},{"a":"STAR","c":"It burns very far away","m":[45,48,6,42]},{"a":"NOON","c":"When both hands point up","m":[46,-1,1,16]}],"free":[7,15,37],"stats":{"score":127.4,"letters":49,"clues":10,"freeQuote":3,"freeAnswer":3,"entropy":3.484,"vowelRatio":0.367,"avgLen":4.9}},{"id":7,"band":"hard","title":"Four Thousand Year Old Noodles","art":"noodle","quote":"The oldest bowl of noodles ever unearthed was made from millet.","fact":["In 2005 archaeologists digging at Lajia in north west China lifted an upturned earthenware bowl that had been buried by a flood roughly four thousand years ago. Underneath, protected by a pocket of air, sat a coil of thin yellow strands. The oldest bowl of noodles ever unearthed was made from millet.","That detail matters more than it sounds. Millet has almost no gluten, so those noodles could not have been rolled and cut in the familiar way. They were most likely pushed through a press or repeatedly stretched from a dough held together by sheer technique, which suggests a well developed cooking tradition rather than a first experiment.","The find did not settle the endless argument about who invented the noodle. Wheat noodles, Arab dried pasta and Italian pasta all have their own long histories and their own evidence, and the honest answer is that people in several places independently worked out that dough could be made into strings."],"factPara":0,"factStart":238,"factEnd":301,"clues":[{"a":"MUFFIN","c":"Breakfast cake, in denial","m":[45,26,14,42,47,27]},{"a":"HARVEST","c":"The payoff for a whole season","m":[1,29,25,23,33,21,51]},{"a":"WHEAT","c":"The grain behind most bread","m":[11,32,2,39,0]},{"a":"MEADOW","c":"Field of grass and wildflowers","m":[38,41,36,5,3,35]},{"a":"BREAD","c":"The oldest thing on the table","m":[9,30,20,-1,40]},{"a":"TOMATO","c":"Fruit that insists it is a vegetable","m":[8,13,46,-1,31,10]},{"a":"SLED","c":"It only works downhill","m":[7,48,22,34]},{"a":"MELON","c":"Big fruit that is mostly water","m":[-1,28,12,16,15]},{"a":"DOOR","c":"You knock before opening it","m":[18,17,44,43]},{"a":"ISLE","c":"Small island in poetry","m":[-1,37,49,6]}],"free":[4,19,24,50],"stats":{"score":136.7,"letters":52,"clues":10,"freeQuote":4,"freeAnswer":4,"entropy":3.803,"vowelRatio":0.385,"avgLen":5.2}},{"id":8,"band":"hard","title":"Spuds In Space","art":"potato","quote":"A potato became the first food ever grown in orbit above our planet.","fact":["A potato became the first food ever grown in orbit above our planet. In 1995 a joint experiment between NASA and the University of Wisconsin carried potato cuttings aboard the shuttle Columbia and produced tubers in weightlessness, proving that a crop could complete part of its life cycle away from the ground.","The potato was not a random choice. It yields more calories per square metre than almost anything else, it stores well, it grows from cuttings rather than seed, and nearly the whole plant is useful. Those are exactly the qualities you want when every gram of cargo is costed to the penny.","On earth the potato has done this before. Domesticated in the Andes thousands of years ago, where farmers still grow a startling range of shapes and colours, it later spread across Europe and quietly rewrote the population history of an entire continent."],"factPara":0,"factStart":0,"factEnd":68,"clues":[{"a":"TRUFFLE","c":"Fungus dogs are trained to find","m":[13,37,47,21,16,50,25]},{"a":"VIVID","c":"So bright it stays with you","m":[44,34,26,39,24]},{"a":"CASHEW","c":"Nut that grows outside its fruit","m":[9,0,19,14,53,32]},{"a":"BAMBOO","c":"Grass tall enough to build with","m":[42,10,11,38,36,2]},{"a":"GRAIN","c":"Wheat, rice and the rest","m":[29,28,41,17,52 function quoteLetters(quote) {
  const out = [], up = quote.toUpperCase();
  for (let i = 0; i < up.length; i++) {
    if (up[i] >= "A" && up[i] <= "Z") out.push(up[i]);
  }
  return out;
}

/*
 * A number identifies a letter rather than a position, so every E in the puzzle
 * carries the same index and they are all solved together. A few letters are
 * left unnumbered as a difficulty lever: they still fill as a group, the player
 * just cannot see where they go until the first one is found.
 */
const MAX_HIDDEN = 3;
function letterIndex(letters, data) {
  const count = {}, order = [];
  letters.forEach(ch => {
    if (count[ch]) count[ch]++;
    else { count[ch] = 1; order.push(ch); }
  });

  /* The builder decides which letters lose their number, because how many and
     which ones are two of the difficulty levers: hiding a letter the quote uses
     eight times removes far more of the map than hiding one used once. Older
     data without a list falls back to hiding the rarest. */
  const hidden = data.hide && data.hide.length
    ? data.hide.filter(ch => count[ch])
    : order.slice()
        .sort((a, b) => count[a] - count[b] || order.indexOf(a) - order.indexOf(b))
        .slice(0, Math.min(MAX_HIDDEN, data.free.length));

  /* numbering follows the quote, and skips the hidden letters so the visible
     run stays contiguous */
  const num = {};
  let n = 0;
  order.forEach(ch => { if (hidden.indexOf(ch) < 0) num[ch] = ++n; });
  return { num: num, hidden: hidden };
}

/*
 * Every letter the player can type is a slot. A slot is reachable from the clue
 * list, from the quote, or from both, which is what makes an answer letter and
 * its quote cell the same thing rather than two values kept in sync.
 */
function buildPuzzle(data) {
  const slots = [];
  const cellSlot = [];
  const letters = quoteLetters(data.quote);

  const clues = data.clues.map((c, ci) => {
    const ids = [];
    for (let j = 0; j < c.a.length; j++) {
      const id = slots.length;
      slots.push({
        id: id, correct: c.a[j], value: "", locked: false,
        clue: ci, pos: j, cell: c.m[j]
      });
      ids.push(id);
    }
    return {
      label: String.fromCharCode(65 + ci),
      text: c.c, answer: c.a, slots: ids, solved: false
    };
  });

  /* every quote cell is a slot of its own, so an answer letter and the quote
     cell it feeds are two places to fill, joined only by their shared letter.
     Filling both at once is what the auto-fill powerup buys. */
  letters.forEach((ch, k) => {
    const id = slots.length;
    slots.push({
      id: id, correct: ch, value: "", locked: false,
      clue: -1, pos: -1, cell: k
    });
    cellSlot[k] = id;
  });

  const ix = letterIndex(letters, data);

  return {
    data: data, slots: slots, cellSlot: cellSlot, clues: clues,
    letters: letters, num: ix.num, hidden: ix.hidden,
    strikes: STRIKES, revived: false, retried: false, quoteHailed: false
  };
}

}

function restoreProgress() {

function saveProgress() {

  let v = "", l = "";

  save();
}

  S.p.clues.forEach(c => {

  });

  return S.p.slots.every(s => s.value === s.correct);

function selectSlot(id, ctx) {
  if (id == null) return;
  S.sel = id;

     reached from a clue keeps walking along that answer. A cell no clue feeds
     can only ever be worked from the quote. */

  if (S.p.slots[id].clue < 0) S.ctx = "quote";
  syncCells();

function advance() {
  const p = S.p, cur = slotOf(S.sel);

  if (cur.clue >= 0 && S.ctx === "clue") {
    const row = p.clues[cur.clue];
    for (let j = cur.pos + 1; j < row.slots.length; j++) {
      if (!p.slots[row.slots[j]].locked) return selectSlot(row.slots[j]);
    }
    for (let c = 1; c <= p.clues.length; c++) {
      const next = p.clues[(cur.clue + c) % p.clues.length];
      for (const id of next.slots) if (!p.slots[id].locked) return selectSlot(id);
    }

  for (let c = cur.cell + 1; c < p.cellSlot.length; c++) {
    const id = p.cellSlot[c];
    if (id != null && !p.slots[id].locked) return selectSlot(id);
  }
  const open = p.slots.find(s => !s.locked);
  if (open) selectSlot(open.id);
}

function retreat() {
  const p = S.p, cur = slotOf(S.sel);
  if (!cur) return;
  if (cur.clue >= 0 && S.ctx === "clue") {
    const row = p.clues[cur.clue];
    for (let j = cur.pos - 1; j >= 0; j--) {

    }
    return;

  for (let c = cur.cell - 1; c >= 0; c--) {
    const id = p.cellSlot[c];
    if (id != null && !p.slots[id].locked) return selectSlot(id);
  }

function backspace() {
  const s = slotOf(S.sel);
  if (!s) return;
  if (!s.locked && s.value) {

    syncCells();
    return;

/*
 * With the auto-fill powerup one correct letter settles every place that letter
 * appears, in the quote and in every answer. A group fill can never be wrong,
 * because a cell's correct value is simply its letter. Without the powerup only
 * the cell the player is on settles, and the rest are merely highlighted.
 */
function fillLetter(slot) {
  const ch = slot.correct;
  const same = S.power ? S.p.slots.filter(s => s.correct === ch) : [slot];
  same.forEach((s, i) => {
    s.value = ch;
    s.locked = true;
    /* the pops run left to right so the spread is legible rather than a flash */
    const wait = Math.min(i * 25, 200);
    setTimeout(() => { bump(s, "pop"); syncCells(); }, wait);
  });
}

/* returns the rows that came out on this keystroke, so the caller can applaud */
function lockCompletedWords() {
  const fresh = [];
  S.p.clues.forEach((row, i) => {
    const done = row.slots.every(id => S.p.slots[id].value === S.p.slots[id].correct);

    if (done && !row.solved) fresh.push(i);
    row.solved = done;
  });
  return fresh;
}

function quoteComplete() {
  return S.p.slots.every(s => s.clue >= 0 || s.value === s.correct);
}

/*
 * Three sizes of applause: a row sweep for a word, the quote card reacting with
 * a ripple and a light burst for the quote, and the full screen cheer for the
 * puzzle. Each one has to feel smaller than the next, which is why the quote is
 * skipped when the same keystroke also wins the puzzle.
 */
function celebrate(rows, quoteWasDone) {
  if (rows.length) {
    rows.forEach((i, k) => setTimeout(() => {
      const node = document.getElementById("row" + i);
      if (!node) return;
      node.classList.add("justSolved");
      setTimeout(() => node.classList.remove("justSolved"), 720);
    }, k * 90));
    buzz(880, 70);
    vibrate(25);
  }

  if (!quoteWasDone && quoteComplete()) {
    S.p.quoteHailed = true;
    cheerQuote();
  }
}

function cheerQuote() {
  const card = app.querySelector(".quoteCard");
  if (card) {
    card.classList.add("done");
    setTimeout(() => card.classList.remove("done"), 1400);
  }

  /* the ripple runs through the bump map so a redraw cannot cut it short */
  S.p.slots.filter(s => s.clue < 0).forEach((s, i) => {
    setTimeout(() => { bump(s, "pop"); syncCells(); }, i * 26);
  });

  const note = document.createElement("div");
  note.className = "midCheer";
  note.innerHTML = `<b>QUOTE COMPLETE</b><span>The whole line is yours</span>`;
  app.appendChild(note);
  setTimeout(() => note.remove(), 1500);

  const cv = document.createElement("canvas");
  cv.className = "fx";
  cv.width = app.clientWidth;
  cv.height = app.clientHeight;
  app.appendChild(cv);
  runConfetti(cv, 40, .3, 78);
  setTimeout(() => cv.remove(), 1500);

  buzz(1180, 120);
  vibrate([20, 40, 20]);
}

function hintLabel() {
  return UNLIMITED_HINTS ? "\u221E" : String(S.profile.hints);
}

function useHint() {
  const p = S.p;
  if (!p || S.overlay) return;
  if (!UNLIMITED_HINTS && S.profile.hints <= 0) return toast("No hints left");
  const s = slotOf(S.sel);
  if (!s || s.locked) return toast("Pick an empty cell first");

  if (!UNLIMITED_HINTS) S.profile.hints--;
  const quoteWasDone = S.p.quoteHailed;
  fillLetter(s);
  const fresh = lockCompletedWords();
  saveProgress();
  save();
  syncCells();
  const hb = app.querySelector(".hintBtn span");
  if (hb) hb.textContent = hintLabel();
  if (isWon()) return void setTimeout(win, 260);
  celebrate(fresh, quoteWasDone);
  advance();
}

const bumps = {};
function bump(slot, cls) {
  bumps[slot.id] = cls;
  setTimeout(() => { delete bumps[slot.id]; syncCells(); }, 380);
}

let actx = null;
function buzz(freq, ms) {
  if (!SOUND) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = actx.createOscillator(), gain = actx.createGain();
    osc.type = "square";
    osc.frequency.value = freq;
    gain.gain.value = .07;
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + ms / 1000);
    osc.stop(actx.currentTime + ms / 1000 + .02);
  } catch (e) {}
}

function vibrate(pattern) {
  if (!HAPTICS || !navigator.vibrate) return;
  try { navigator.vibrate(pattern); } catch (e) {}
}

/*
 * A shake on one small cell was too quiet to register as a cost, so a strike now
 * lands on the whole screen at once.
 */
function flashLife() {
  const nodes = app.querySelectorAll(".life");
  /* called after the strike is deducted, so this is the box just stamped */
  const idx = STRIKES - S.p.strikes - 1;
  const box = nodes[idx];
  if (box) {
    box.classList.add("pop");
    setTimeout(() => box.classList.remove("pop"), 460);
    const chip = document.createElement("span");
    chip.className = "minus";
    chip.textContent = "-1";
    box.appendChild(chip);
    setTimeout(() => chip.remove(), 820);
  }

  const row = app.querySelector(".lives");
  if (row) {
    row.classList.add("hit");
    setTimeout(() => row.classList.remove("hit"), 460);
  }

  const flash = document.createElement("div");
  flash.className = "strikeFlash";
  app.appendChild(flash);
  setTimeout(() => flash.remove(), 540);

  const left = S.p.strikes;
  strikeMsg(left);
  buzz(150, 220);
  vibrate(left ? 70 : [50, 60, 110]);
}

function strikeMsg(left) {
  app.querySelectorAll(".strikeMsg").forEach(n => n.remove());
  const el = document.createElement("div");
  el.className = "strikeMsg" + (left <= 1 ? " final" : "");
  el.textContent = left === 0 ? "Out of strikes"
    : left === 1 ? "Wrong letter. Last strike!"
    : "Wrong letter. " + left + " strikes left";
  app.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function showFail() {

function doRevive() {

    S.p.strikes = 1;
    S.p.revived = true;

    saveProgress();
    render();

function doRetry() {
  /* coins are not deducted yet, the cost is shown for the flow only */
  S.p = buildPuzzle(puzzles[S.pi]);
  S.p.retried = true;
  S.sel = firstOpenSlot();
  S.overlay = null;
  clearProgress(keyOf(S.p.data));

}

function abandon() {
  S.profile.streak = 0;
  delete S.profile.power[keyOf(S.p.data)];
  clearProgress(keyOf(S.p.data));
  save();
  S.overlay = null;
  goHome();
}

/* ============================================================= flow: win */

function win() {
  const p = S.p;
  S.profile.done[keyOf(p.data)] = true;
  S.profile.streak++;
  S.profile.best = Math.max(S.profile.best, S.profile.streak);

  delete S.profile.power[keyOf(p.data)];
  const reward = S.profile.streak % HINT_EVERY === 0;
  if (reward) S.profile.hints++;
  S.streakInfo = { streak: S.profile.streak, reward: reward };

  clearProgress(keyOf(p.data));
  save();

  cheer();
  setTimeout(() => {
    playAd("interstitial", () => {
      S.screen = "streak";
      render();
      setTimeout(() => {
        const bar = app.querySelector(".progBar i");
        if (bar) bar.style.width = barWidth() + "%";
      }, 120);
      const jump = setTimeout(gotoReview, 3400);
      app.onclick = () => { clearTimeout(jump); app.onclick = null; gotoReview(); };
    });
  }, 1900);
}

function barWidth() {
  const inCycle = S.streakInfo.streak % HINT_EVERY;
  return (inCycle === 0 ? HINT_EVERY : inCycle) / HINT_EVERY * 100;
}

function gotoReview() {
  app.onclick = null;
  S.screen = "review";
  S.reviewTab = "fact";
  render();
}

function goHome() {
  S.screen = "home";
  S.p = null;
  S.sel = null;
  render();
}

/* ============================================================== overlays */

function playAd(kind, done) {
  S.overlay = kind;
  paintOverlay();
  setTimeout(() => {

}

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  app.appendChild(el);

}

function cheer() {
  const box = document.createElement("div");
  box.className = "cheer";
  box.innerHTML = `<div class="big">Solved!</div><div class="sub">Nicely worked out</div>`;
  app.appendChild(box);

  const cv = document.createElement("canvas");
  cv.id = "confetti";
  cv.width = app.clientWidth;
  cv.height = app.clientHeight;
  app.appendChild(cv);
  /* the loudest of the three: denser and longer than the quote burst */
  runConfetti(cv, 200, .42, 150);

  buzz(1320, 240);
  vibrate([30, 50, 30, 50, 80]);

  setTimeout(() => { box.remove(); cv.remove(); }, 1900);
}

function runConfetti(cv, count, originY, frames) {
  const ctx = cv.getContext("2d");
  const colors = ["#FF8A3D", "#FFB020", "#31BFA3", "#3FBE80", "#FF5F5F", "#FFD9AE"];
  const bits = [];
  for (let i = 0; i < count; i++) {
    bits.push({
      x: cv.width / 2 + (Math.random() - .5) * 120,
      y: cv.height * originY + (Math.random() - .5) * 60,
      vx: (Math.random() - .5) * 9,
      vy: -6 - Math.random() * 9,
      w: 5 + Math.random() * 6,
      h: 8 + Math.random() * 8,
      rot: Math.random() * 6.3,
      spin: (Math.random() - .5) * .35,
      c: colors[(Math.random() * colors.length) | 0]
    });
  }
  let n = 0;
  (function step() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => {
      b.vy += .38; b.x += b.vx; b.y += b.vy; b.rot += b.spin; b.vx *= .995;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.fillStyle = b.c;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();
    });
    if (++n < frames && cv.isConnected) requestAnimationFrame(step);
  })();
}

/* ================================================================ render */

function render() {
  app.querySelectorAll(".screen,.introVeil").forEach(n => n.remove());
  const el = document.createElement("div");

  if (S.screen === "review") wireRail(".scrollinner", ".reviewBody");
  if (S.screen === "home") wireRail(".scrollinner", ".scrollbox");

  if (S.screen === "intro") {

/* ------------------------------------------------------------ puzzle */

function puzzleHtml() {
  const p = S.p, d = p.data;

  const spent = STRIKES - p.strikes;
  const lives = [0, 1, 2].map(i =>
    `<div class="life ${i < spent ? "spent" : ""}">${XMARK}</div>`).join("");

  /* the quote wraps a word at a time so no answer is ever split across rows */
  let ci = 0, groups = [], cur = "";
  const up = d.quote.toUpperCase();
  for (let i = 0; i < up.length; i++) {
    const ch = up[i];
    if (ch >= "A" && ch <= "Z") {
      const slot = p.slots[p.cellSlot[ci]];
      const n = p.num[slot.correct];
      /* an unnumbered letter still fills as a group, it just cannot be mapped */
      cur += `<div class="cell ${n ? "" : "free"}" id="q${ci}" data-cell="${ci}">
                ${n ? `<span class="ix">${n}</span>` : ""}<b></b></div>`;
      ci++;
    } else if (ch === " ") {
      if (cur) groups.push(`<div class="qword">${cur}</div>`);
      cur = "";
    } else {
      if (cur) groups.push(`<div class="qword">${cur}</div>`);
      cur = "";
      groups.push(`<span class="qpunc">${ch}</span>`);
    }
  }
  if (cur) groups.push(`<div class="qword">${cur}</div>`);

  /*
   * Side by side reads tighter, but a clue that wraps squeezes the answer cells
   * into a column, so anything long switches the whole list to stacked.
   */
  const longest = Math.max.apply(null, d.clues.map(c => c.c.length));
  const widest = Math.max.apply(null, d.clues.map(c => c.a.length));
  const stack = longest > 30 || widest > 6;

  const rows = p.clues.map((row, i) => {
    const cells = row.slots.map(id => {
      const s = p.slots[id];
      /* the same number as every other cell holding this letter, which is what
         tells the player the two places are the same answer */
      const n = p.num[s.correct];
      return `<div class="cell ${n ? "" : "free"}" id="a${id}" data-slot="${id}">
                ${n ? `<span class="ix">${n}</span>` : ""}<b></b></div>`;
    }).join("");
    return `
      <div class="clueRow ${stack ? "stack" : ""}" id="row${i}">
        <div class="clueHead">
          <div class="lbl">${row.label}</div>
          <div class="txt">${row.text}</div>
        </div>
        <div class="ansCells">${cells}</div>
      </div>`;
  }).join("");

  const keys = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
  const kb = keys.map((r, i) => {
    let row = r.split("").map(k => `<button class="key" data-key="${k}">${k}</button>`).join("");
    if (i === 2) row += `<button class="key wide" data-key="DEL">&#9003;</button>`;
    return `<div class="krow">${row}</div>`;
  }).join("");

  return `
    <div class="topbar">
      <button class="iconbtn" data-act="home">&#8592;</button>
      <div class="titles">
        <div class="t1">${d.title}</div>
        <div class="t2">${packInfo().name.toUpperCase()} &middot; PUZZLE ${d.id} &middot; ${d.band.toUpperCase()}</div>
      </div>
      <div class="lives">${lives}</div>
    </div>

    <div class="quoteCard"><div class="quoteGrid">${groups.join("")}</div></div>

    <div class="clueWrap">
      <div class="clueScroll">${rows}</div>
      <div class="rail"><div class="thumb"></div></div>
      <button class="hintBtn ${UNLIMITED_HINTS || S.profile.hints ? "" : "empty"}" data-act="hint">
        &#128161; <span>${hintLabel()}</span>
      </button>
    </div>

    <div class="kb">${kb}</div>
    <div class="banner">BANNER AD</div>`;
}

/*
 * Cell size is measured rather than guessed, because the row count depends on
 * where words happen to break, not just on how many letters there are. Four
 * rows is the target for every quote, short ones simply use fewer.
 */
const ROW_GAP = 6;
const MIN_CW = 20;
const COMFY_CW = 24;
function fitQuote() {
  const grid = app.querySelector(".quoteGrid");
  if (!grid) return;
  const target = 4;
  const sizes = [28, 26, 24, 22, 21, 20];

  /* measure every candidate once, then decide */
  const rowsAt = {};
  for (const size of sizes) {
    apply(size);
    rowsAt[size] = Math.round((grid.offsetHeight + ROW_GAP) / (size * 1.34 + ROW_GAP));
  }

  /*
   * Legible index numbers matter more than a tight row count, so a quote is
   * allowed one row beyond its target rather than shrink under COMFY_CW, and
   * MIN_CW is the hard floor whatever the row count comes to.
   */
  const exact = sizes.find(s => rowsAt[s] <= target);
  const loose = sizes.find(s => rowsAt[s] <= target + 1);
  apply(exact >= COMFY_CW ? exact : (loose || exact || MIN_CW));

  function apply(size) {
    grid.style.setProperty("--cw", size + "px");
    grid.style.setProperty("--cf", Math.round(size * 0.58) + "px");
    grid.style.setProperty("--ixf", Math.max(6, Math.min(9, Math.round(size * 0.32))) + "px");
  }
}

/*
 * Cells are patched in place rather than re-rendered so the pop and shake
 * animations survive, the clue list keeps its scroll position, and typing on a
 * long puzzle stays cheap.
 */
function syncCells() {
  const p = S.p;
  if (!p) return;
  const sel = p.slots[S.sel];
  const selClue = sel ? sel.clue : -2;

  /* one slot, one cell: a clue letter draws in the list, a quote letter in the
     quote. Every other cell holding the selected letter is marked as a peer,
     across both grids, which is how a shared index reads before it is solved.
     An unnumbered letter never marks peers: with no index on show, revealing
     where it goes would hand back the difficulty that hiding it bought. */
  const spread = !!(sel && p.num[sel.correct]);
  p.slots.forEach(s => {
    const node = s.clue >= 0
      ? document.getElementById("a" + s.id)
      : document.getElementById("q" + s.cell);
    if (!node) return;

    const cls = ["cell"];
    if (!p.num[s.correct]) cls.push("free");
    if (s.locked) cls.push("lock");
    else if (s.value && s.value !== s.correct) cls.push("wrong");
    if (bumps[s.id]) cls.push(bumps[s.id]);
    if (sel) {
      if (s.id === sel.id) cls.push("sel");
      else if (spread && s.correct === sel.correct) cls.push("peer");
    }

    node.className = cls.join(" ");
    node.querySelector("b").textContent = s.value;
  });

  p.clues.forEach((row, i) => {
    const node = document.getElementById("row" + i);
    if (!node) return;
    node.classList.toggle("active", i === selClue);
    node.classList.toggle("solved", row.solved);
  });

  const spent = STRIKES - p.strikes;
  app.querySelectorAll(".life").forEach((n, i) => n.classList.toggle("spent", i < spent));
}

function scrollClueIntoView() {
  const sel = S.p.slots[S.sel];
  if (!sel || sel.clue < 0) return;
  const row = document.getElementById("row" + sel.clue);
  const box = app.querySelector(".clueScroll");
  if (!row || !box) return;
  const top = row.offsetTop, bot = top + row.offsetHeight;
  if (top < box.scrollTop + 4) box.scrollTo({ top: top - 8, behavior: "smooth" });
  else if (bot > box.scrollTop + box.clientHeight - 60) {
    box.scrollTo({ top: bot - box.clientHeight + 66, behavior: "smooth" });
  }
}

/* ------------------------------------------------------------ streak */

/*
 * Made up for now, but shaped like a real retention curve: almost everyone
 * strings two together, a run in the thirties is rare. Swap in real numbers once
 * there are any.
 */
function streakRarity(n) {
  const bands = [
    [2, 68], [4, 52], [9, 38], [14, 24], [19, 17], [29, 13]
  ];
  for (const b of bands) if (n <= b[0]) return b[1];
  return 10;
}

function themeDone() {
  const pre = packInfo().id + ":";
  return Object.keys(S.profile.done).filter(k => k.indexOf(pre) === 0).length;
}

function streakHtml() {
  const info = S.streakInfo;
  const inCycle = info.streak % HINT_EVERY === 0 ? HINT_EVERY : info.streak % HINT_EVERY;
  const pips = [];
  for (let i = 1; i <= HINT_EVERY; i++) {
    const on = i <= inCycle;
    pips.push(i === HINT_EVERY
      ? `<div class="pip goal ${on ? "on" : ""}">&#128161;</div>`
      : `<div class="pip ${on ? "on" : ""}"></div>`);
  }

  const best = S.profile.best;
  const isBest = info.streak >= best;
  const wins = info.streak === 1 ? "WIN IN A ROW" : "WINS IN A ROW";

  return `
    <div class="streakScreen">
      <div class="flame">&#128293;</div>
      <div class="streakN">${info.streak}</div>
      <div class="streakL">${wins}</div>
      <div class="streakNote">Solved back to back without giving up.
        Retry and Revive keep it alive &mdash; only walking away resets it.</div>
      <div class="streakStats">
        <div class="sbox ${isBest ? "on" : ""}">
          <div class="n">${best}</div>
          <div class="l">BEST RUN</div>
          ${isBest ? `<div class="tagNew">NEW</div>` : ``}
        </div>
        <div class="sbox">
          <div class="n">${themeDone()}<span style="font-size:15px;color:var(--muted)">/${
            puzzles.length}</span></div>
          <div class="l">THIS THEME</div>
        </div>
      </div>
      <div class="streakProof">Only ${streakRarity(info.streak)}% of players hold a
        ${info.streak} win streak. Keep it going.</div>
      <div class="progWrap">
        <div class="progTop">
          <span>${inCycle} of ${HINT_EVERY} WINS</span>
          <span>NEXT HINT</span>
        </div>
        <div class="progBar"><i></i></div>
        <div class="pips">${pips.join("")}</div>
      </div>
      ${info.reward ? `<div class="rewardCard">&#127881; Five wins in a row &middot; +1 hint</div>` : ``}
      <div class="tapOn">TAP TO CONTINUE</div>
    </div>
    <div class="banner">BANNER AD</div>`;
}

/* ------------------------------------------------------------ review */

function reviewHtml() {
  const d = S.p.data;

  const paras = d.fact.map((text, i) => {
    if (i !== d.factPara) return `<p>${text}</p>`;
    return `<p>${text.slice(0, d.factStart)}<mark>${
      text.slice(d.factStart, d.factEnd)}</mark>${text.slice(d.factEnd)}</p>`;
  }).join("");

  const recap = d.clues.map((c, i) => `
    <div class="recapRow">
      <div class="w">${String.fromCharCode(65 + i)} &nbsp;${c.a}</div>
      <div class="c">${c.c}</div>
    </div>`).join("");

  const onFact = S.reviewTab === "fact";
  const next = S.pi + 1 < puzzles.length;

  return `
    <div class="reviewArt">${ART[d.art] || ""}</div>
    <div class="reviewHead"><h2>${d.title}</h2></div>
    <div class="reviewBody">
      <div class="scrollinner">${onFact ? paras : `<div class="recap">${recap}</div>`}</div>
      <div class="rail"><div class="thumb"></div></div>
    </div>
    <div class="reviewCtas">
      <button class="btn ghost" data-act="flip">
        ${onFact ? "See the clues" : "Back to the fact"}
      </button>
      <button class="btn primary" data-act="next">${next ? "NEXT PUZZLE" : "BACK TO PACK"}</button>
    </div>
    <div class="banner">BANNER AD</div>`;
}

/* ============================================================= scroll rail */

function wireRail(innerSel, wrapSel) {
  const wrap = app.querySelector(wrapSel);
  if (!wrap) return;
  const inner = wrap.querySelector(innerSel) || app.querySelector(innerSel);
  const rail = wrap.querySelector(".rail");
  if (!inner || !rail) return;
  const thumb = rail.querySelector(".thumb");

  function update() {
    const ratio = inner.clientHeight / inner.scrollHeight;
    if (ratio >= 1) { rail.style.opacity = "0"; return; }
    rail.style.opacity = "1";
    const h = Math.max(28, rail.clientHeight * ratio);
    const max = rail.clientHeight - h;
    const p = inner.scrollTop / (inner.scrollHeight - inner.clientHeight);
    thumb.style.height = h + "px";
    thumb.style.transform = "translateY(" + (p * max) + "px)";
  }
  inner.addEventListener("scroll", update, { passive: true });
  requestAnimationFrame(update);
  setTimeout(update, 120);
}

/* ================================================================= events */

app.addEventListener("click", e => {
  const tab = e.target.closest("[data-pack]");
  if (tab) {
    const i = +tab.dataset.pack;
    if (i === S.pack) return;
    setPack(i);
    return render();
  }

  const openCard = e.target.closest("[data-open]");
  if (openCard) {
    const i = +openCard.dataset.open;
    /* a part-played puzzle goes straight back to the board, powerup and all */
    return S.profile.progress[keyOf(puzzles[i])] ? openPuzzle(i) : enterPuzzle(i);
  }

  const key = e.target.closest("[data-key]");
  if (key) {
    const k = key.dataset.key;
    return k === "DEL" ? backspace() : typeLetter(k);
  }

  const cell = e.target.closest("[data-cell]");
  if (cell) {
    const id = S.p.cellSlot[+cell.dataset.cell];
    if (id != null) selectSlot(id, "quote");
    return;
  }

  const ac = e.target.closest("[data-slot]");
  if (ac) return selectSlot(+ac.dataset.slot, "clue");

  const act = e.target.closest("[data-act]");
  if (!act) return;
  switch (act.dataset.act) {
    case "home": if (S.p) saveProgress(); goHome(); break;
    case "hint": useHint(); break;
    case "revive": doRevive(); break;
    case "retry": doRetry(); break;
    case "askQuit": S.overlay = "confirm"; paintOverlay(); break;
    case "quitNo": S.overlay = "fail"; paintOverlay(); break;
    case "quitYes": abandon(); break;
    case "play": startPuzzle(); break;
    case "power": togglePower(act); break;
    case "flip": S.reviewTab = S.reviewTab === "fact" ? "clues" : "fact"; render(); break;
    case "next":
      if (S.pi + 1 < puzzles.length) enterPuzzle(S.pi + 1);
      else goHome();
      break;
  }
});

document.addEventListener("keydown", e => {
  if (S.screen !== "puzzle" || S.overlay) return;
  if (e.key === "Backspace") { e.preventDefault(); return backspace(); }
  if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); typeLetter(e.key.toUpperCase()); }
});

window.addEventListener("resize", () => {
  if (S.screen === "puzzle") fitQuote();
});

/* =================================================================== boot */

if (!PACKS.length || !puzzles.length) {
  app.innerHTML = `<div style="padding:40px;text-align:center;font-weight:800">
    No pack data.<br><span style="font-weight:600;color:#7B6A60;font-size:14px">
    Run <code>cscript //nologo tools\\build-puzzles.js</code> to generate it.</span></div>`;
} else {
  /* #3 opens puzzle 3 straight away, which saves a lot of tapping while testing */
  const jump = parseInt((location.hash || "").replace("#", ""), 10);
  if (jump >= 1 && jump <= puzzles.length) openPuzzle(jump - 1);
  else render();
}

})();
</script>
